class Player {
  constructor() {
    this.x = 0;
    this.y = 0;
    this._mv = { x: 0, y: 0 };
    this.facing = 1; // 1 = direita, -1 = esquerda
    this.pulses = [];                            // ondas de combo recém-desbloqueado
    this._vp = { x: 0, y: 0, r: 0, t: 0 };       // param reaproveitado pelos vfx
  }
  reset(cls) {
    this.x = 0; this.y = 0;
    this.radius = BALANCE.player.radius;
    this.baseSpeed = cls.base.speed;
    this.speed = this.baseSpeed;
    this.maxHp = cls.base.maxHp;
    this.hp = this.maxHp;
    this.level = 1;
    this.xp = 0;
    this.xpToNext = xpForLevel(1);
    this.basePickup = 95;
    this.pickupRange = 95;
    this.pendingLevels = 0;
    this.dmgReduction = 0;
    this.kills = 0;
    this.animTime = 0;
    this.moving = false;
    this.forms = cls.forms || DEFAULT_FORMS;
    this.formIdx = 0;
    this.vfxTime = 0;
    this.pulses.length = 0;
  }
  gainXp(v) {
    this.xp += v;
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.xpToNext = xpForLevel(this.level);
      this.pendingLevels++;
    }
  }
  update(dt, input) {
    const mv = input.moveVector(this._mv);
    if (mv.x !== 0) this.facing = mv.x > 0 ? 1 : -1;
    this.x += mv.x * this.speed * dt;
    this.y += mv.y * this.speed * dt;
    this.moving = mv.x !== 0 || mv.y !== 0;
    this.animTime += dt * (this.moving ? 1 : 0.25);
    this.vfxTime += dt;
    for (let i = this.pulses.length - 1; i >= 0; i--) {
      this.pulses[i].t += dt;
      if (this.pulses[i].t >= COMBO_PULSE_LIFE) this.pulses.splice(i, 1);
    }
  }
  // forma atual pelo nº de combos ativos: vence a última cujo `at` foi atingido
  formIndex(comboCount) {
    let idx = 0;
    for (let i = 0; i < this.forms.length; i++) {
      if (comboCount >= this.forms[i].at) idx = i;
    }
    return idx;
  }
  // onda de choque disparada quando um combo é desbloqueado
  comboPulse(color) {
    this.pulses.push({ t: 0, rgb: hexRgb(color) });
  }
  draw(ctx, cam, combos, abilities) {
    const sx = this.x - cam.left;
    const sy = this.y - cam.top;
    const r = this.radius;
    const active = combos ? combos.active : NO_COMBOS;
    const spellFx = abilities ? abilities.vfx : NO_COMBOS;
    const t = this.vfxTime;

    const form = this.forms[this.formIndex(active.length)];
    const spr = SPRITES[form.sprite];
    const drawH = r * form.scale;
    const anim = walkAnim(this.animTime, this.moving);
    if (form.dy) anim.bob += form.dy * r; // formas mais altas: mantém os pés no chão

    const p = this._vp;
    p.x = sx; p.y = sy; p.r = r; p.t = t;
    p.spr = spr; p.drawH = drawH; p.anim = anim; p.flip = this.facing < 0;

    // aura de combo (halo colorido + fel reforçada + brilho no sprite) fica
    // reservada para a forma máxima; antes dela, só a aura fel original
    const auraOn = !!form.aura;
    const boost = auraOn ? active.length : 0;

    const auraR = r * (2.2 + boost * 0.12);
    const aura = ctx.createRadialGradient(sx, sy, r * 0.4, sx, sy, auraR);
    aura.addColorStop(0, `rgba(122,60,255,${0.3 + boost * 0.04})`);
    aura.addColorStop(1, "rgba(122,60,255,0)");
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(sx, sy, auraR, 0, Math.PI * 2); ctx.fill();

    // halo aditivo na cor de cada combo, respirando fora de fase
    if (auraOn && active.length) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < active.length; i++) {
        const c = active[i];
        const k = 0.5 + Math.sin(t * 2 + i * 1.7) * 0.5;
        const hr = r * (1.7 + i * 0.16 + k * 0.25);
        const g = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, hr);
        g.addColorStop(0, `rgba(${c.rgb},${(0.05 + k * 0.07).toFixed(3)})`);
        g.addColorStop(1, `rgba(${c.rgb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(sx, sy, hr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // ondas do desbloqueio
    for (let i = 0; i < this.pulses.length; i++) {
      const pu = this.pulses[i], k = pu.t / COMBO_PULSE_LIFE;
      const rr = r * (1 + k * 5);
      ctx.strokeStyle = `rgba(${pu.rgb},${((1 - k) * 0.8).toFixed(2)})`;
      ctx.lineWidth = 1 + 3 * (1 - k);
      ctx.beginPath();
      ctx.ellipse(sx, sy + r * 0.6, rr, rr * 0.45, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (let i = 0; i < spellFx.length; i++) {
      p.lvl = spellFx[i].inst.level;
      spellFx[i].def.vfx.under?.(ctx, p);
    }
    for (let i = 0; i < active.length; i++) {
      const v = active[i].vfx;
      if (v && v.under) v.under(ctx, p);
    }

    drawShadow(ctx, sx, sy, r);
    drawSprite(ctx, spr, sx, sy, drawH, this.facing < 0, 0, anim);

    // o próprio warlock brilha na cor do combo (alterna quando há vários)
    if (auraOn && active.length) {
      const c = active[Math.floor(t / 2.4) % active.length];
      const k = (Math.sin(t * 3) + 1) * 0.5;
      drawSpriteGlow(ctx, spr, sx, sy, drawH, this.facing < 0, anim,
        c.color, 0.16 + k * 0.2);
    }

    for (let i = 0; i < spellFx.length; i++) {
      p.lvl = spellFx[i].inst.level;
      spellFx[i].def.vfx.over?.(ctx, p);
    }
    for (let i = 0; i < active.length; i++) {
      const v = active[i].vfx;
      if (v && v.over) v.over(ctx, p);
    }
  }
}

class Enemy {
  constructor() {
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
  }
  // chamado pelo Pool.spawn — recebe o tipo, a posição inicial e o `scale`
  // of the current difficulty phase ({ hp, dmg, speed }, see SpawnManager)
  reset(obj, type, x, y, scale) {
    this.type = type;
    this.x = x; this.y = y;
    this.radius = type.radius;
    this.speed = Math.min(type.speed * scale.speed,
      BALANCE.player.speed * BALANCE.spawn.speedCap);
    this.maxHp = type.hp * (type.boss ? Math.pow(scale.hp, BALANCE.spawn.bossHpExp) : scale.hp);
    this.hp = this.maxHp;
    this.touchDps = type.touchDps * scale.dmg;
    this.shootDamage = (type.shootDamage || 0) * scale.dmg;
    this.hitFlash = 0;
    this.facing = 1;
    this.animTime = Math.random() * 6; // fase aleatória p/ não andarem em sincronia
    // estados de feitiço
    this.corrTime = 0; this.corrTickTimer = 0; this.corrDmg = 0;
    this.corrTick = 0.5; this.corrupted = false;
    this.corrPulse = 0;                 // flash a cada tick do DoT
    this.corrAnim = Math.random() * 6;  // fase própria da névoa
    this.curseTime = 0;
    this.shootTimer = type.shootInterval || 0;
  }
  update(dt, player) {
    let dx = player.x - this.x;
    let dy = player.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.x += (dx / d) * this.speed * dt;
    this.y += (dy / d) * this.speed * dt;
    this.facing = dx < 0 ? -1 : 1;
    this.animTime += dt * (this.speed / 90);
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.corrTime > 0) this.corrAnim += dt;
    if (this.corrPulse > 0) this.corrPulse = Math.max(0, this.corrPulse - dt * 3.2);
  }
  draw(ctx, cam) {
    const sx = this.x - cam.left;
    const sy = this.y - cam.top;
    const r = this.radius;

    const spr = SPRITES[this.type.id];
    const flash = this.hitFlash > 0 ? Math.min(0.85, this.hitFlash / 0.1 * 0.85) : 0;
    const anim = walkAnim(this.animTime, true);
    if (this.corrTime > 0) this.drawCorrUnder(ctx, sx, sy, r);
    if (spr) {
      drawShadow(ctx, sx, sy, r);
      drawSprite(ctx, spr, sx, sy, r * 2.7, this.facing < 0, flash, anim);
    } else {
      ctx.fillStyle = this.type.color;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    }
    if (this.corrTime > 0) this.drawCorrOver(ctx, sx, sy, r, spr, anim);

    // barra de HP para bosses
    if (this.type.boss) {
      const bw = r * 2, bh = 5, by = sy - r - 12;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(sx - r, by, bw, bh);
      ctx.fillStyle = "#ff3b6b";
      ctx.fillRect(sx - r, by, bw * Math.max(0, this.hp / this.maxHp), bh);
    }
  }
  // névoa da Corruption no chão, sob o inimigo
  drawCorrUnder(ctx, sx, sy, r) {
    const fade = Math.min(1, this.corrTime / 0.5);
    const pulse = this.corrPulse, t = this.corrAnim;

    const w = r * (1.25 + pulse * 0.3);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = fade * (0.24 + pulse * 0.22);
    ctx.drawImage(glowBlob("#7fdc4a"), sx - w, sy + r * 0.5 - w * 0.45, w * 2, w * 0.9);
    ctx.restore();

    // anel apodrecido girando no chão — visível em inimigo de qualquer cor
    ctx.save();
    ctx.translate(sx, sy + r * 0.95);
    ctx.scale(1, 0.4);
    ctx.rotate(-t * 1.1);
    ctx.strokeStyle = `rgba(127,220,74,${(fade * (0.5 + pulse * 0.4)).toFixed(2)})`;
    ctx.lineWidth = 1.4 + pulse;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.65, a, a + 1.1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // podridão sobre o inimigo: tinta esverdeada, orbes girando e onda a cada tick
  drawCorrOver(ctx, sx, sy, r, spr, anim) {
    const fade = Math.min(1, this.corrTime / 0.5);
    const pulse = this.corrPulse, t = this.corrAnim;

    if (spr) {
      drawSpriteGlow(ctx, spr, sx, sy, r * 2.7, this.facing < 0, anim,
        "#7fdc4a", fade * (0.05 + pulse * 0.09));
    }

    const blob = glowBlob("#7fdc4a");
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) {
      const a = t * 2.2 + (i / 3) * Math.PI * 2;
      const depth = 0.7 + Math.sin(a) * 0.3;
      const px = sx + Math.cos(a) * r * 1.5;
      const py = sy - r * 0.1 + Math.sin(a) * r * 0.55;
      const w = r * 0.32 * depth * (1 + pulse * 0.3);
      ctx.globalAlpha = fade * 0.5 * depth;
      ctx.drawImage(blob, px - w, py - w, w * 2, w * 2);
      ctx.globalAlpha = fade * 0.8 * depth;
      ctx.fillStyle = "#d9ff9e";
      ctx.beginPath(); ctx.arc(px, py, 1.2 * depth, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // onda que sai do corpo no ritmo do dano do DoT
    if (pulse > 0) {
      const k = 1 - pulse;
      ctx.strokeStyle = `rgba(190,255,140,${(fade * pulse * 0.78).toFixed(2)})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(sx, sy + r * 0.35, r * (1 + k * 1.7), r * (0.4 + k * 0.75),
        0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

}

class Projectile {
  constructor() { this.dead = false; }
  reset(obj, o) {
    this.x = o.x; this.y = o.y;
    this.vx = o.vx; this.vy = o.vy;
    this.damage = o.damage;
    this.radius = o.radius;
    this.color = o.color;
    this.source = o.source;
    this.life = o.life;
    this.hostile = o.hostile || false; // true = dano no player (boss)
    this.homing = o.homing || false;   // teleguiado: curva atrás do alvo
    this.speed = o.speed || Math.hypot(o.vx, o.vy);
    this.turnRate = o.turnRate || 0;   // rad/s de curva
    this.pierce = o.pierce || 0;
    // perfurantes guardam quem já acertaram (evita multi-hit no mesmo alvo)
    if (this.pierce > 0) { this.hits = this.hits || new Set(); this.hits.clear(); }
    else this.hits = null;
    // rastro: buffer plano [x0,y0,...] amostrado por DISTÂNCIA, não por frame,
    // p/ o rastro ter o mesmo comprimento em qualquer fps/velocidade de jogo.
    if (o.trail) {
      this.trailMax = 24;                        // amostras guardadas
      this.trailStep = o.trail / this.trailMax;  // px entre amostras
      this.trail = this.trail || [];
      this.trail.length = 0;
      this.rgb = hexRgb(this.color);
      this.age = 0;
    } else this.trail = null;
    this.dead = false;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.trail) {
      this.age += dt;
      const t = this.trail, step = this.trailStep;
      if (!t.length) t.push(this.x, this.y);
      else {
        const lx = t[t.length - 2], ly = t[t.length - 1];
        const dx = this.x - lx, dy = this.y - ly, d = Math.hypot(dx, dy);
        const n = Math.min(Math.floor(d / step), this.trailMax);
        for (let i = 1; i <= n; i++) {
          const f = (i * step) / d;
          t.push(lx + dx * f, ly + dy * f);
        }
      }
      while (t.length > this.trailMax * 2) t.splice(0, 2);
    }
    if (this.life <= 0) this.dead = true;
  }
  draw(ctx, cam) {
    const sx = this.x - cam.left, sy = this.y - cam.top, r = this.radius;
    if (this.trail) { this.drawComet(ctx, cam, sx, sy, r); return; }
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 2);
    g.addColorStop(0, "#fff");
    g.addColorStop(0.4, this.color);
    g.addColorStop(1, "rgba(122,60,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, r * 2, 0, Math.PI * 2); ctx.fill();
  }

  // rastro em cometa: blobs suaves ao longo das últimas posições + cabeça esticada
  drawComet(ctx, cam, sx, sy, r) {
    const t = this.trail, n = t.length >> 1;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    if (n >= 3) {
      const blob = glowBlob(this.color);
      const total = n + 1;                     // + posição atual, p/ colar na cabeça
      for (let i = 0; i < total; i++) {
        const k = i / (total - 1);             // 0 = cauda, 1 = cabeça
        const x = i < n ? t[i * 2] - cam.left : sx;
        const y = i < n ? t[i * 2 + 1] - cam.top : sy;
        const w = r * (0.95 + 1.8 * k * k);
        ctx.globalAlpha = 0.38 * k * Math.sqrt(k);
        ctx.drawImage(blob, x - w, y - w, w * 2, w * 2);
      }
      ctx.globalAlpha = 1;
    }

    // cabeça: halo esticado no eixo do voo, com pulso sutil
    const pulse = 1 + Math.sin(this.age * 26) * 0.12;
    ctx.translate(sx, sy);
    ctx.rotate(Math.atan2(this.vy, this.vx));
    ctx.scale(1.5, 0.85);
    const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.6 * pulse);
    halo.addColorStop(0, "#fff");
    halo.addColorStop(0.28, this.color);
    halo.addColorStop(0.62, `rgba(${this.rgb},0.35)`);
    halo.addColorStop(1, `rgba(${this.rgb},0)`);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.6 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

class XPOrb {
  constructor() {}
  reset(obj, x, y, value) {
    this.x = x; this.y = y; this.value = value;
    this.magnet = false; // ativado pelo item Ímã de Almas
  }
  // ímã: acelera em direção ao player quando dentro do pickupRange (ou sempre, se magnet)
  update(dt, player) {
    const dx = player.x - this.x, dy = player.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    if (this.magnet || d < player.pickupRange) {
      const pull = this.magnet ? 560 : 240 + (player.pickupRange - d) * 6;
      this.x += (dx / d) * pull * dt;
      this.y += (dy / d) * pull * dt;
    }
    return d < player.radius + 6; // true = coletado
  }
  draw(ctx, cam) {
    const sx = this.x - cam.left, sy = this.y - cam.top;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 7);
    g.addColorStop(0, "#d8ffb0");
    g.addColorStop(0.5, "#6fdc4a");
    g.addColorStop(1, "rgba(58,122,38,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 7, 0, Math.PI * 2); ctx.fill();
  }
}

// Item dropado no chão; coletado ao encostar.
class Pickup {
  constructor() {}
  reset(obj, x, y, itemId) {
    this.x = x; this.y = y;
    this.item = ITEMS[itemId];
    this.bob = Math.random() * 6.28;
  }
  draw(ctx, cam) {
    const sx = this.x - cam.left, sy = this.y - cam.top - Math.sin(this.bob) * 3;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 18);
    g.addColorStop(0, this.item.color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = "20px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(this.item.icon, sx, sy);
    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
  }
}

class Particle {
  constructor() {}
  reset(obj, x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= 0.9; this.vy *= 0.9;
    this.life -= dt;
    return this.life <= 0;
  }
  draw(ctx, cam) {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x - cam.left, this.y - cam.top, this.size * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// Zona de dano no chão (Rain of Fire e, depois, explosões de combo).
class AreaEffect {
  constructor() {}
  reset(obj, o) {
    this.x = o.x; this.y = o.y;
    this.radius = o.radius;
    this.dps = o.dps;
    this.life = o.life; this.maxLife = o.life;
    this.tickInterval = o.tickInterval;
    this.tickTimer = o.tickInterval;
    this.rgb = hexRgb(o.color);
    this.source = o.source;
  }
  draw(ctx, cam) {
    const sx = this.x - cam.left, sy = this.y - cam.top;
    const a = Math.min(1, this.life / 0.4) * 0.5; // fade out no fim
    const g = ctx.createRadialGradient(sx, sy, this.radius * 0.2, sx, sy, this.radius);
    g.addColorStop(0, `rgba(${this.rgb},${a * 0.55})`);
    g.addColorStop(0.6, `rgba(${this.rgb},${a * 0.32})`);
    g.addColorStop(1, `rgba(${this.rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, this.radius, 0, Math.PI * 2); ctx.fill();
  }
}

// Gera inimigos fora da tela em fluxo contínuo, escalando com o tempo.
class SpawnManager {
  constructor() { this.reset(); }
  reset() {
    this.timer = 0;
    this.interval = BALANCE.spawn.baseInterval;
    this.scale = { hp: 1, dmg: 1, speed: 1 };
    this.ramps = 0;
    this.rampClock = 0;   // time accumulated since the last ramp
    this.hard = false;    // has BALANCE.spawn.hardAt been crossed yet?
    this.nextWaveAt = BALANCE.spawn.waveEvery;
    this.nextBossAt = BALANCE.spawn.bossAt;
  }
  // true past the 5 min mark — the hard phase uses a different set of numbers
  isHard(elapsed) { return elapsed >= BALANCE.spawn.hardAt; }

  // ajusta dificuldade conforme o tempo decorrido. The ramp is timed by
  // accumulation (not floor(elapsed / rampEvery)) because the cadence changes
  // mid-run: the early phase's 30s become 15s past hardAt.
  applyScaling(dt, elapsed) {
    const B = BALANCE.spawn;
    const hard = this.isHard(elapsed);
    const every = hard ? B.hardRampEvery : B.rampEvery;
    this.rampClock += dt;
    while (this.rampClock >= every) {
      this.rampClock -= every;
      this.ramps++;
      this.interval = Math.max(hard ? B.hardMinInterval : B.minInterval,
        this.interval * (hard ? B.hardIntervalDecay : B.intervalDecay));
      this.scale.hp *= 1 + (hard ? B.hardHpGrowth : B.hpGrowth);
      this.scale.dmg *= 1 + (hard ? B.hardDmgGrowth : B.dmgGrowth);
      this.scale.speed *= 1 + (hard ? B.hardSpeedGrowth : B.speedGrowth);
    }
  }
  // spawn weight of this type in the current phase
  weightOf(type, late) {
    return late && type.lateWeight != null ? type.lateWeight : type.weight;
  }
  pickType(elapsed) {
    const late = this.isHard(elapsed);
    let total = 0;
    const pool = [];
    for (const id in ENEMIES) {
      const t = ENEMIES[id];
      if (t.boss || elapsed < t.minTime) continue;
      pool.push(t); total += this.weightOf(t, late);
    }
    let roll = (this.timer * 9301 + elapsed * 49297) % total; // pseudo-random barato
    for (const t of pool) { if ((roll -= this.weightOf(t, late)) < 0) return t; }
    return pool[0];
  }
  // how many Dreadlords come out at once — grows through the hard phase
  bossCount(elapsed) {
    const B = BALANCE.spawn;
    if (!this.isHard(elapsed)) return 1;
    const extra = Math.floor((elapsed - B.hardAt) / B.hardBossStack);
    return Math.min(B.maxBossStack, 1 + extra);
  }
  update(dt, game) {
    const B = BALANCE.spawn;
    this.applyScaling(dt, game.elapsed);

    const hard = this.isHard(game.elapsed);
    if (hard && !this.hard) { this.hard = true; game.onHardPhase(); }

    // wave densa em círculo
    if (game.elapsed >= this.nextWaveAt) {
      this.nextWaveAt += hard ? B.hardWaveEvery : B.waveEvery;
      this.spawnWave(game);
    }
    // mini-boss Dreadlord
    if (game.elapsed >= this.nextBossAt) {
      this.nextBossAt += hard ? B.hardBossEvery : B.bossEvery;
      this.spawnBoss(game);
    }

    if (game.enemies.active.length >= (hard ? B.hardMaxAlive : B.maxAlive)) return;
    this.timer += dt;
    while (this.timer >= this.interval) {
      this.timer -= this.interval;
      this.spawnOne(game);
    }
  }
  _reach(game) {
    const cam = game.camera;
    return Math.hypot(cam.w, cam.h) / 2 + BALANCE.spawn.margin;
  }
  spawnOne(game) {
    const reach = this._reach(game);
    const a = (game.elapsed * 2.3 + game.enemies.active.length * 1.7) % (Math.PI * 2);
    const x = game.player.x + Math.cos(a) * reach;
    const y = game.player.y + Math.sin(a) * reach;
    game.enemies.spawn(this.pickType(game.elapsed), x, y, this.scale);
  }
  spawnWave(game) {
    const reach = this._reach(game) * 0.92;
    const n = BALANCE.spawn.waveBase + this.ramps * 4;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 / n) * i;
      const x = game.player.x + Math.cos(a) * reach;
      const y = game.player.y + Math.sin(a) * reach;
      game.enemies.spawn(this.pickType(game.elapsed), x, y, this.scale);
    }
  }
  spawnBoss(game) {
    const reach = this._reach(game);
    const n = this.bossCount(game.elapsed);
    const base = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      const a = base + (Math.PI * 2 / n) * i;
      const x = game.player.x + Math.cos(a) * reach;
      const y = game.player.y + Math.sin(a) * reach;
      game.enemies.spawn(ENEMIES.dreadlord, x, y, this.scale);
    }
    game.onBossSpawn(n);
  }
}

// Mantém as habilidades adquiridas, roda o auto-cast e contabiliza dano.
class AbilitySystem {
  reset() {
    this.owned = new Map();   // id -> { level, timer }
    this.damage = new Map();  // id -> dano total acumulado (stats/game over)
    this.vfx = [];            // spells com efeito visual no personagem
  }
  has(id) { return this.owned.has(id); }
  level(id) { return this.owned.get(id)?.level || 0; }

  // adiciona uma spell nova ou sobe seu nível
  acquire(id, api) {
    let inst = this.owned.get(id);
    if (inst) inst.level = Math.min(inst.level + 1, SPELLS[id].maxLevel);
    else { inst = { level: 1, timer: 0 }; this.owned.set(id, inst); }
    SPELLS[id].onChange?.(inst, api);
    this.rebuildVfx();
  }

  // lista pronta p/ o render não alocar por frame: spells possuídas que têm vfx
  rebuildVfx() {
    this.vfx.length = 0;
    for (const [id, inst] of this.owned) {
      if (SPELLS[id].vfx) this.vfx.push({ def: SPELLS[id], inst });
    }
  }

  record(id, amount) {
    this.damage.set(id, (this.damage.get(id) || 0) + amount);
  }

  tick(dt, api) {
    for (const [id, inst] of this.owned) {
      SPELLS[id].tick(dt, api, inst);
    }
  }

  draw(ctx, api, cam) {
    for (const [id, inst] of this.owned) {
      SPELLS[id].draw?.(ctx, api, inst, cam);
    }
  }
}

// Buffs adquiridos (linha 2). Mantém níveis e o objeto agregado de modifiers.
class BuffSystem {
  reset() { this.owned = new Map(); this.recompute(); }
  has(id) { return this.owned.has(id); }
  level(id) { return this.owned.get(id) || 0; }
  acquire(id) {
    this.owned.set(id, Math.min(this.level(id) + 1, BUFFS[id].maxLevel));
    this.recompute();
  }
  // re-agrega os modifiers a partir dos buffs possuídos
  recompute() {
    const m = {
      damage: 1, cooldown: 1, area: 1, projectiles: 0, duration: 1,
      moveSpeed: 1, armor: 0, regen: 0, xp: 1, pickup: 1,
    };
    for (const [id, l] of this.owned) BUFFS[id].apply(m, l);
    m.cooldown = Math.max(0.35, m.cooldown);
    this.mods = m;
  }
}

// Monta as 3 cartas oferecidas a cada level up.
class UpgradeSystem {
  // candidatos das DUAS linhas: spells da classe + buffs globais.
  // cada um: novo (não possuído) ou upgrade (abaixo do nível máximo)
  getChoices(game) {
    const cls = CLASSES[game.selectedClass];
    const pool = [];
    const add = (kind, id, def, curLevel) => {
      if (curLevel === 0) pool.push({ kind, id, def, isNew: true, from: 0, to: 1 });
      else if (curLevel < def.maxLevel) pool.push({ kind, id, def, isNew: false, from: curLevel, to: curLevel + 1 });
    };
    for (const id of cls.spellPool) add("spell", id, SPELLS[id], game.abilities.level(id));
    for (const id in BUFFS) add("buff", id, BUFFS[id], game.buffs.level(id));

    // embaralha e pega até 3
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 3);
  }
}

// Desbloqueia combos quando os requisitos são atingidos.
class ComboSystem {
  constructor() {
    this.preview = new Set(); // ligados na amostra do menu; sobrevive ao reset
    this.reset();
  }
  reset() { this.unlocked = new Set(); this.active = []; this.rebuildActive(); }
  // só o que foi desbloqueado de fato conta pro jogo (empower, api.hasCombo)
  has(id) { return this.unlocked.has(id); }
  // `active` = o que aparece no personagem (desbloqueado + preview), como array
  // pronto para o render não alocar nada por frame
  rebuildActive() {
    this.active.length = 0;
    for (const c of COMBOS) {
      if (!this.unlocked.has(c.id) && !this.preview.has(c.id)) continue;
      if (!c.rgb) c.rgb = hexRgb(c.color);
      this.active.push(c);
    }
  }
  togglePreview(id) {
    if (this.preview.has(id)) this.preview.delete(id);
    else this.preview.add(id);
    this.rebuildActive();
  }
  setAllPreview(on) {
    this.preview.clear();
    if (on) for (const c of COMBOS) this.preview.add(c.id);
    this.rebuildActive();
  }
  // checa após cada aquisição; retorna os combos recém-desbloqueados (p/ toast)
  check(abilities, buffs) {
    const lvl = (r) => (r.kind === "buff" ? buffs.level(r.id) : abilities.level(r.id));
    const newly = [];
    for (const c of COMBOS) {
      if (this.unlocked.has(c.id)) continue;
      if (c.requires.every((r) => lvl(r) >= r.level)) {
        this.unlocked.add(c.id);
        newly.push(c);
      }
    }
    if (newly.length) this.rebuildActive();
    return newly;
  }
}

/* =========================================================================
   GAME — estado global + loop + máquina de estados
   ========================================================================= */

const STATE = { MENU: "menu", PLAYING: "playing", LEVELUP: "levelup", GAMEOVER: "gameover", PAUSED: "paused", CHEST: "chest" };

class Game {
  constructor() {
    this.canvas = document.getElementById("canvas");
    this.ctx = this.canvas.getContext("2d");
    this.dpr = Math.min(devicePixelRatio || 1, 2);

    buildSprites();
    this.input = new InputManager();
    this.camera = new Camera();
    this.camera.pattern = this.ctx.createPattern(makeGroundTile(), "repeat");
    this.player = new Player();

    this.enemies = new Pool(() => new Enemy(), (o, ...a) => o.reset(o, ...a));
    this.projectiles = new Pool(() => new Projectile(), (o, ...a) => o.reset(o, ...a));
    this.orbs = new Pool(() => new XPOrb(), (o, ...a) => o.reset(o, ...a));
    this.areas = new Pool(() => new AreaEffect(), (o, ...a) => o.reset(o, ...a));
    this.particles = new Pool(() => new Particle(), (o, ...a) => o.reset(o, ...a));
    this.pickups = new Pool(() => new Pickup(), (o, ...a) => o.reset(o, ...a));
    this.spawner = new SpawnManager();
    this.lastBossChestAt = -BALANCE.spawn.bossChestCooldown;
    this.sfx = new Sfx();
    this.grid = new SpatialGrid(48);
    this.abilities = new AbilitySystem();
    this.buffs = new BuffSystem();
    this.upgrades = new UpgradeSystem();
    this.combos = new ComboSystem();
    this.api = this.buildApi();

    this.state = STATE.MENU;
    this.selectedClass = "warlock";
    this.selectedSpeed = 1;   // escolhido no menu
    this.timeScale = 1;       // aplicado ao iniciar
    this.elapsed = 0;        // segundos de sobrevivência
    this.lastTime = 0;
    this._dmgTimer = 0;      // throttle do medidor de dano

    this._loop = this._loop.bind(this);
    addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "m") this.sfx.muted = !this.sfx.muted;
      if (e.key === "Escape") this.togglePause();
    });
    addEventListener("resize", () => this.resize());
    this.resize();
    this.setupComboPreview();
    this.buildMenu();

    // HUD refs
    this.ui = {
      hud: document.getElementById("hud"),
      menu: document.getElementById("menu"),
      timer: document.getElementById("timer"),
      kills: document.getElementById("kills"),
      hpFill: document.getElementById("hpFill"),
      xpFill: document.getElementById("xpFill"),
      hpLabel: document.getElementById("hpLabel"),
      xpLabel: document.getElementById("xpLabel"),
      gameover: document.getElementById("gameover"),
      stats: document.getElementById("stats"),
      abilities: document.getElementById("abilityBar"),
      buffBar: document.getElementById("buffBar"),
      dmgHud: document.getElementById("dmgHud"),
      levelup: document.getElementById("levelup"),
      cards: document.getElementById("cards"),
      toasts: document.getElementById("toasts"),
      pause: document.getElementById("pause"),
      pausePanel: document.getElementById("pausePanel"),
      chest: document.getElementById("chest"),
      chestList: document.getElementById("chestList"),
      chestRarity: document.getElementById("chestRarity"),
    };
    document.getElementById("restartBtn").onclick = () => this.start();
    document.getElementById("chestBtn").onclick = () => this.closeChest();
    document.getElementById("resumeBtn").onclick = () => this.resume();
    document.getElementById("pauseRestartBtn").onclick = () => this.start();
    document.getElementById("quitBtn").onclick = () => this.quitToMenu();

    requestAnimationFrame(this._loop);
  }

  resize() {
    const w = innerWidth, h = innerHeight;
    this.canvas.width = w * this.dpr;
    this.canvas.height = h * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.camera.resize(w, h);
  }

  // stats base da spell com buffs globais + empoderamento de combo aplicados
  buffedStats(def, level) {
    const s = def.stats(level), m = this.buffs.mods;
    if (s.damage != null) s.damage *= m.damage;
    if (s.dps != null) s.dps *= m.damage;
    if (s.cooldown != null) s.cooldown = Math.max(0.05, s.cooldown * m.cooldown);
    // tickInterval menor = DoT pulsa mais rápido (mais dano total na mesma duração)
    if (s.tickInterval != null) s.tickInterval = Math.max(0.08, s.tickInterval * m.cooldown);
    if (s.count != null) s.count += m.projectiles;
    if (s.radius != null) s.radius *= m.area;
    if (s.duration != null) s.duration *= m.duration;

    // combo ativo empodera DRASTICAMENTE a spell envolvida
    for (const c of COMBOS) {
      const e = c.empower;
      if (!e || e.spell !== def.id || !this.combos.has(c.id)) continue;
      if (e.damage) { if (s.damage != null) s.damage *= e.damage; if (s.dps != null) s.dps *= e.damage; }
      if (e.cooldown && s.cooldown != null) s.cooldown *= e.cooldown;
      if (e.area && s.radius != null) s.radius *= e.area;
      if (e.duration && s.duration != null) s.duration *= e.duration;
    }
    return s;
  }

  addShake(mag) { this.camera.shake = Math.max(this.camera.shake, mag); }

  spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      this.particles.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.3 + Math.random() * 0.3, color, 2 + Math.random() * 2.5);
    }
  }

  onBossSpawn(count = 1) {
    this.addShake(10 + (count - 1) * 4);
    this.sfx.boss();
    this.showToast({ head: "Chefe!", color: "#b23cff", icon: "☠",
      name: count > 1 ? `${count} Dreadlords!` : "Dreadlord!",
      desc: count > 1
        ? "Os nathrezim cercaram você pela Distorção Profana."
        : "Um nathrezim emergiu da Distorção Profana." });
  }

  // 5 min mark: the spawn curve shifts gear (see BALANCE.spawn.hardAt)
  onHardPhase() {
    this.addShake(14);
    this.sfx.boss();
    this.showToast({ head: "A Distorção rasgou!", color: "#ff3b6b", icon: "🔥",
      name: "A Legião avança",
      desc: "A horda fica mais rápida, mais densa e mais letal a cada 15s." });
  }

  // API desacoplada entregue às habilidades no tick (não tocam o Game direto)
  buildApi() {
    const game = this;
    return {
      get player() { return game.player; },
      get elapsed() { return game.elapsed; },
      stats(def, level) { return game.buffedStats(def, level); },
      fireProjectile(o) { game.projectiles.spawn(o); },
      spawnArea(o) { game.areas.spawn(o); },
      damageEnemy(e, amount, source) { game.damageEnemy(e, amount, source); },
      heal(amount) {
        const p = game.player;
        p.hp = Math.min(p.maxHp, p.hp + amount);
      },
      forEnemiesInRadius(x, y, r, fn) { game.grid.forRadius(x, y, r, fn); },
      hasCombo(id) { return game.combos.has(id); },
      // inimigo vivo mais próximo de (x,y) dentro de maxDist
      nearestEnemy(x, y, maxDist) {
        const list = game.enemies.active;
        let best = null, bestD = maxDist * maxDist;
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          const dx = e.x - x, dy = e.y - y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD) { bestD = d2; best = e; }
        }
        return best;
      },
      // até `count` inimigos mais próximos dentro de maxDist
      nearestEnemies(x, y, maxDist, count) {
        const list = game.enemies.active, md2 = maxDist * maxDist, hits = [];
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          const dx = e.x - x, dy = e.y - y, d2 = dx * dx + dy * dy;
          if (d2 < md2) hits.push([d2, e]);
        }
        hits.sort((a, b) => a[0] - b[0]);
        const out = [];
        for (let i = 0; i < Math.min(count, hits.length); i++) out.push(hits[i][1]);
        return out;
      },
    };
  }

  // Canvas de amostra do menu: um warlock parado só para exibir os vfx de combo.
  setupComboPreview() {
    if (!DEV_MODE) {
      document.getElementById("comboBlock").style.display = "none";
      return; // sem previewCtx, renderComboPreview vira no-op
    }
    const c = document.getElementById("comboPreview");
    c.width = COMBO_PREVIEW_SIZE * this.dpr;
    c.height = COMBO_PREVIEW_SIZE * this.dpr;
    this.previewCtx = c.getContext("2d");
    this.previewCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.previewGround = this.previewCtx.createPattern(makeGroundTile(), "repeat");
    this.previewPlayer = new Player();
    this.previewPlayer.reset(CLASSES.warlock);
    this.previewPlayer.moving = true;
    this.previewCam = { left: 0, top: 0 };
  }

  renderComboPreview() {
    const ctx = this.previewCtx;
    if (!ctx) return;
    const S = COMBO_PREVIEW_SIZE, p = this.previewPlayer;
    ctx.fillStyle = this.previewGround;
    ctx.fillRect(0, 0, S, S);
    ctx.fillStyle = "rgba(10,7,16,0.35)";
    ctx.fillRect(0, 0, S, S);
    p.animTime += 1 / 60;
    p.vfxTime += 1 / 60;
    this.previewCam.left = p.x - S / 2;
    this.previewCam.top = p.y - S * 0.58;
    p.draw(ctx, this.previewCam, this.combos);
  }

  // --- Menu de seleção de classe ---
  buildMenu() {
    const grid = document.getElementById("classGrid");
    grid.innerHTML = "";
    for (const id in CLASSES) {
      const c = CLASSES[id];
      const card = document.createElement("div");
      card.className = "class-card " + (c.available ? "available" : "locked")
        + (c.available && id === this.selectedClass ? " selected" : "");
      card.innerHTML = `
        <div class="class-icon" style="background:radial-gradient(circle at 35% 30%, #fff, ${c.color})"></div>
        <div class="class-name">${c.name}</div>
        <div class="class-tag">${c.tag}</div>`;
      if (c.available) {
        card.onclick = () => {
          this.selectedClass = id;
          this.buildMenu();
        };
      }
      grid.appendChild(card);
    }
    document.getElementById("startBtn").onclick = () => this.start();

    document.querySelectorAll(".speed-btn").forEach((b) => {
      b.classList.toggle("active", +b.dataset.spd === this.selectedSpeed);
      b.onclick = () => {
        this.selectedSpeed = +b.dataset.spd;
        document.querySelectorAll(".speed-btn").forEach((o) =>
          o.classList.toggle("active", o === b));
      };
    });

    if (!DEV_MODE) return;

    const toggles = document.getElementById("comboToggles");
    toggles.innerHTML = "";
    for (const c of COMBOS) {
      const on = this.combos.preview.has(c.id);
      const b = document.createElement("button");
      b.className = "combo-btn";
      b.title = `${c.name} — ${c.desc}`;
      b.innerHTML = `<span style="color:${c.color}">${c.icon}</span>`;
      if (on) {
        b.style.borderColor = c.color;
        b.style.boxShadow = `0 0 12px rgba(${hexRgb(c.color)},0.55)`;
      }
      b.onclick = () => { this.combos.togglePreview(c.id); this.buildMenu(); };
      toggles.appendChild(b);
    }
    const allOn = this.combos.preview.size === COMBOS.length;
    const all = document.createElement("button");
    all.className = "combo-btn wide";
    all.textContent = allOn ? "Nenhum" : "Todos";
    all.onclick = () => { this.combos.setAllPreview(!allOn); this.buildMenu(); };
    toggles.appendChild(all);
  }

  start() {
    const cls = CLASSES[this.selectedClass];
    this.timeScale = this.selectedSpeed;
    this.player.reset(cls);
    this.enemies.clear();
    this.projectiles.clear();
    this.orbs.clear();
    this.areas.clear();
    this.particles.clear();
    this.pickups.clear();
    this.sfx.init();
    this.spawner.reset();
    this.lastBossChestAt = -BALANCE.spawn.bossChestCooldown;
    this.abilities.reset();
    this.buffs.reset();
    this.combos.reset();
    this.ui.toasts.innerHTML = "";
    (cls.starting || []).forEach((id) => this.abilities.acquire(id, this.api));
    this.updateAbilityBar();
    this.player.formIdx = this.player.formIndex(this.combos.active.length);
    this.elapsed = 0;
    this.camera.x = this.player.x;
    this.camera.y = this.player.y;
    this.camera.follow(this.player, 0, true);
    this.state = STATE.PLAYING;
    this.ui.menu.classList.add("hidden");
    this.ui.gameover.classList.add("hidden");
    this.ui.levelup.classList.add("hidden");
    this.ui.pause.classList.add("hidden");
    this.ui.chest.classList.add("hidden");
    this.ui.hud.classList.remove("hidden");
  }

  gameOver() {
    this.state = STATE.GAMEOVER;
    this.sfx.gameOver();
    this.ui.hud.classList.add("hidden");
    const p = this.player;
    const m = Math.floor(this.elapsed / 60), s = Math.floor(this.elapsed % 60);
    let dmgRows = "";
    const dmg = [...this.abilities.damage.entries()].sort((a, b) => b[1] - a[1]);
    for (const [id, total] of dmg) {
      const name = SPELLS[id]?.name || id;
      dmgRows += `<div class="stat"><span>${name}</span><b>${Math.round(total).toLocaleString("pt-BR")}</b></div>`;
    }
    this.ui.stats.innerHTML = `
      <div class="stat"><span>Sobreviveu</span><b>${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</b></div>
      <div class="stat"><span>Abates</span><b>${p.kills}</b></div>
      <div class="stat"><span>Nível</span><b>${p.level}</b></div>
      ${dmgRows ? `<div class="stat-head">Dano por habilidade</div>${dmgRows}` : ""}`;
    this.ui.gameover.classList.remove("hidden");
  }

  // --- Pausa (ESC) ---
  togglePause() {
    if (this.state === STATE.PLAYING) {
      this.state = STATE.PAUSED;
      this.renderPausePanel();
      this.ui.pause.classList.remove("hidden");
    } else if (this.state === STATE.PAUSED) {
      this.resume();
    }
  }

  // Pause screen: owned spells/buffs with their levels, plus every combo
  // and how many levels are still missing to unlock it.
  renderPausePanel() {
    const defOf = (r) => (r.kind === "buff" ? BUFFS[r.id] : SPELLS[r.id]);
    const lvlOf = (r) => (r.kind === "buff" ? this.buffs.level(r.id) : this.abilities.level(r.id));

    const powerRow = (def, level) => {
      const max = def.maxLevel;
      const atMax = level >= max;
      const next = atMax
        ? "Nível máximo atingido."
        : `<b>Nv ${level + 1}:</b> ${def.desc(level + 1)}`;
      return `<div class="pw-row">
        <div class="pw-ic" style="border-color:${def.color};color:${def.color}">${def.icon}</div>
        <div class="pw-body">
          <div class="pw-top">
            <span class="pw-name">${def.name}</span>
            <span class="pw-lv ${atMax ? "max" : ""}">${atMax ? "MÁX" : `Nv ${level}/${max}`}</span>
          </div>
          <div class="pw-bar"><div class="pw-fill" style="width:${(level / max) * 100}%;background:${def.color}"></div></div>
          <div class="pw-next">${next}</div>
        </div>
      </div>`;
    };

    let spellsHtml = "";
    for (const [id, inst] of this.abilities.owned) spellsHtml += powerRow(SPELLS[id], inst.level);
    let buffsHtml = "";
    for (const [id, lvl] of this.buffs.owned) buffsHtml += powerRow(BUFFS[id], lvl);

    const rows = COMBOS.map((c) => {
      const reqs = c.requires.map((r) => {
        const cur = lvlOf(r);
        return { def: defOf(r), cur, need: r.level, done: cur >= r.level };
      });
      const need = reqs.reduce((a, r) => a + r.need, 0);
      const have = reqs.reduce((a, r) => a + Math.min(r.cur, r.need), 0);
      return { c, reqs, need, have, missing: need - have, unlocked: this.combos.has(c.id) };
    });
    rows.sort((a, b) => (b.unlocked - a.unlocked) || (a.missing - b.missing));

    let combosHtml = "";
    for (const r of rows) {
      const pct = (r.have / r.need) * 100;
      const label = r.unlocked
        ? "Ativo"
        : r.missing === 1 ? "Falta 1 nível" : `Faltam ${r.missing} níveis`;
      const cls = r.unlocked ? "on" : r.missing <= 2 ? "close" : "";
      const reqHtml = r.reqs.map((q) =>
        `<span class="cb-req-row ${q.done ? "ok" : ""}">
          <span style="color:${q.def.color}">${q.def.icon}</span>${q.def.name}
          <b>${Math.min(q.cur, q.need)}/${q.need}</b></span>`).join("");
      combosHtml += `<div class="cb-row ${r.unlocked ? "done" : ""} ${!r.unlocked && r.have === 0 ? "far" : ""}"
          style="border-color:${r.unlocked ? r.c.color : "rgba(255,255,255,0.1)"}">
        <div class="cb-head">
          <span class="cb-ic" style="color:${r.c.color}">${r.c.icon}</span>
          <span class="cb-name">${r.c.name}</span>
          <span class="cb-status ${cls}">${label}</span>
        </div>
        <div class="cb-desc">${r.c.desc}</div>
        <div class="cb-bar"><div class="cb-fill" style="width:${pct}%;background:${r.c.color}"></div></div>
        <div class="cb-req">${reqHtml}</div>
      </div>`;
    }

    const unlockedCount = rows.filter((r) => r.unlocked).length;
    this.ui.pausePanel.innerHTML = `
      <div class="pause-col">
        <div class="pause-head">Spells</div>
        ${spellsHtml || `<div class="pause-empty">Nenhuma spell ainda.</div>`}
        <div class="pause-head">Buffs</div>
        ${buffsHtml || `<div class="pause-empty">Nenhum buff ainda.</div>`}
      </div>
      <div class="pause-col">
        <div class="pause-head">Combos — ${unlockedCount}/${rows.length}</div>
        ${combosHtml}
      </div>`;
  }
  resume() {
    this.ui.pause.classList.add("hidden");
    this.state = STATE.PLAYING;
  }
  quitToMenu() {
    this.ui.pause.classList.add("hidden");
    this.ui.hud.classList.add("hidden");
    this.state = STATE.MENU;
    this.buildMenu();
    this.ui.menu.classList.remove("hidden");
  }

  // --- Level up: pausa e oferece até 3 cartas ---
  openLevelUp() {
    this.state = STATE.LEVELUP;
    this.sfx.levelUp();
    const choices = this.upgrades.getChoices(this);
    if (choices.length === 0) {           // nada a oferecer (tudo no máximo)
      this.player.pendingLevels = 0;
      this.state = STATE.PLAYING;
      return;
    }
    this.ui.cards.innerHTML = "";
    for (const c of choices) {
      const card = document.createElement("div");
      card.className = "card card-" + c.kind;
      const tag = c.kind === "spell" ? "Spell" : "Buff";
      const hint = this.comboHintFor(c);
      const hintHtml = hint
        ? `<div class="card-combo ${hint.completes ? "ready" : ""}" style="color:${hint.combo.color};border-color:${hint.combo.color}">
            ${hint.combo.icon} ${hint.completes ? "Completa" : "Combo"}: ${hint.combo.name}</div>`
        : "";
      card.innerHTML = `
        <div class="card-kind">${tag}</div>
        <div class="card-icon" style="color:${c.def.color}">${c.def.icon}</div>
        <div class="card-name">${c.def.name}</div>
        <div class="card-level">${c.isNew ? "NOVO" : `Nível ${c.from} → ${c.to}`}</div>
        <div class="card-desc">${c.def.desc(c.to)}</div>
        ${hintHtml}`;
      card.onclick = () => this.applyChoice(c);
      this.ui.cards.appendChild(card);
    }
    this.ui.levelup.classList.remove("hidden");
  }

  // hint de combo p/ uma carta: só quando a OUTRA peça do combo já foi adquirida.
  // retorna { combo, completes } ou null
  comboHintFor(choice) {
    const lvlOf = (r) => (r.kind === "buff" ? this.buffs.level(r.id) : this.abilities.level(r.id));
    for (const c of COMBOS) {
      if (this.combos.has(c.id)) continue;
      const mine = c.requires.find((r) => r.kind === choice.kind && r.id === choice.id);
      if (!mine) continue;
      const others = c.requires.filter((r) => r !== mine);
      if (!others.every((r) => lvlOf(r) >= 1)) continue; // outra peça precisa já existir
      const completes = choice.to >= mine.level && others.every((r) => lvlOf(r) >= r.level);
      return { combo: c, completes };
    }
    return null;
  }

  applyChoice(c) {
    if (c.kind === "spell") this.abilities.acquire(c.id, this.api);
    else this.buffs.acquire(c.id);
    this.updateAbilityBar();
    this.combos.check(this.abilities, this.buffs).forEach((combo) => {
      this.sfx.combo();
      this.addShake(16);
      this.spawnParticles(this.player.x, this.player.y, combo.color, 32);
      this.player.comboPulse(combo.color);
      this.showToast(combo);
    });
    this.checkEvolution();
    this.player.pendingLevels--;
    this.ui.levelup.classList.add("hidden");
    if (this.player.pendingLevels > 0) this.openLevelUp();
    else this.state = STATE.PLAYING;
  }

  // troca de forma do personagem quando o nº de combos cruza um limiar
  checkEvolution() {
    const idx = this.player.formIndex(this.combos.active.length);
    if (idx === this.player.formIdx) return;
    const grew = idx > this.player.formIdx;
    this.player.formIdx = idx;
    const f = this.player.forms[idx];
    if (!grew || !f.name) return;
    this.sfx.combo();
    this.addShake(22);
    this.spawnParticles(this.player.x, this.player.y, f.color, 44);
    this.player.comboPulse(f.color);
    this.showToast({ head: "Metamorfose!", color: f.color, icon: f.icon,
      name: f.name, desc: f.desc });
  }

  // notificação genérica (combo/item/boss); auto-remove via animação CSS
  showToast(combo) {
    const el = document.createElement("div");
    el.className = "toast";
    el.style.borderColor = combo.color;
    el.innerHTML = `
      <div class="toast-head"><span style="color:${combo.color}">${combo.icon}</span> ${combo.head || "Combo desbloqueado!"}</div>
      <div class="toast-name">${combo.name}</div>
      <div class="toast-desc">${combo.desc}</div>`;
    this.ui.toasts.appendChild(el);
    setTimeout(() => el.remove(), 5200);
  }

  // HUD: duas fileiras — spells em cima, buffs embaixo
  updateAbilityBar() {
    const icon = (def, level) => `<div class="ab-icon" style="border-color:${def.color}">
        <span style="color:${def.color}">${def.icon}</span><b>${level}</b></div>`;
    let spells = "";
    for (const [id, inst] of this.abilities.owned) spells += icon(SPELLS[id], inst.level);
    this.ui.abilities.innerHTML = spells;
    let buffs = "";
    for (const [id, lvl] of this.buffs.owned) buffs += icon(BUFFS[id], lvl);
    this.ui.buffBar.innerHTML = buffs;
    this.updateDamageHud();
  }

  // medidor de dano acumulado por spell (ordenado, barra relativa ao maior)
  updateDamageHud() {
    const dmg = this.abilities.damage;
    const rows = [];
    for (const [id] of this.abilities.owned) rows.push({ def: SPELLS[id], val: dmg.get(id) || 0 });
    rows.sort((a, b) => b.val - a.val);
    const max = rows.length ? Math.max(1, rows[0].val) : 1;
    let html = "";
    for (const r of rows) {
      html += `<div class="dmg-row">
        <span class="dmg-ic" style="color:${r.def.color}">${r.def.icon}</span>
        <div class="dmg-bar">
          <div class="dmg-fill" style="width:${(r.val / max * 100)}%;background:${r.def.color}"></div>
          <span class="dmg-val">${fmtNum(r.val)}</span>
        </div></div>`;
    }
    this.ui.dmgHud.innerHTML = html;
  }

  // --- Loop principal: rAF + delta time ---
  _loop(now) {
    requestAnimationFrame(this._loop);
    if (!this.lastTime) this.lastTime = now;
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (dt > 0.1) dt = 0.1; // clamp (evita salto após troca de aba)

    // sub-stepping: aplica a velocidade do jogo em passos pequenos p/ estabilidade
    let total = dt * this.timeScale;
    while (total > 0) {
      const step = Math.min(0.025, total);
      this.update(step);
      total -= step;
    }
    this.render();
  }

  update(dt) {
    if (this.state !== STATE.PLAYING) return;
    this.elapsed += dt;
    this.player.update(dt, this.input);

    this.applyPassives(dt);             // Demon Armor: regen + redução de dano
    this.spawner.update(dt, this);
    this.updateEnemies(dt);              // move + grid + separação + contato + DoT
    this.abilities.tick(dt, this.api);  // auto-cast de todas as habilidades
    this.updateProjectiles(dt);          // move + colisão → dano
    this.updateAreas(dt);                // zonas de fogo → dano em área
    this.killDeadEnemies();              // morte → orbe + kill + Life Tap + spread
    this.updateOrbs(dt);                 // ímã + coleta → XP
    this.updatePickups(dt);              // itens dropados
    this.updateParticles(dt);

    this.camera.follow(this.player, dt);
    this.camera.updateShake(dt);
    this.updateHUD();
    this._dmgTimer -= dt;
    if (this._dmgTimer <= 0) { this._dmgTimer = 0.25; this.updateDamageHud(); }

    if (this.player.hp <= 0) { this.gameOver(); return; }
    if (this.player.pendingLevels > 0) this.openLevelUp();
  }

  updateEnemies(dt) {
    const list = this.enemies.active;
    const p = this.player;
    this.grid.clear();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      e.update(dt, p);
      this.grid.insert(e);

      // DoT da Corruption
      if (e.corrTime > 0) {
        e.corrTime -= dt;
        e.corrTickTimer -= dt;
        if (e.corrTickTimer <= 0) {
          e.corrTickTimer += e.corrTick;
          e.corrPulse = 1;
          this.damageEnemy(e, e.corrDmg, "corruption");
        }
      }

      // colisão com o player → dano por contato (mitigado por Demon Armor)
      const dx = p.x - e.x, dy = p.y - e.y;
      const rr = p.radius + e.radius;
      if (dx * dx + dy * dy < rr * rr) {
        p.hp -= e.touchDps * dt * (1 - p.dmgReduction);
      }

      // boss ranged: dispara projétil hostil no player
      if (e.type.ranged) {
        e.shootTimer -= dt;
        const t = e.type;
        if (e.shootTimer <= 0 && dx * dx + dy * dy < t.shootRange * t.shootRange) {
          e.shootTimer = t.shootInterval;
          const a = Math.atan2(p.y - e.y, p.x - e.x);
          this.projectiles.spawn({
            x: e.x, y: e.y,
            vx: Math.cos(a) * t.shootSpeed, vy: Math.sin(a) * t.shootSpeed,
            damage: e.shootDamage, radius: 7, color: "#ff4db8",
            source: "enemy", life: 3, pierce: 0, hostile: true,
          });
        }
      }
    }
    this.separateEnemies();
  }

  updateParticles(dt) {
    const list = this.particles.active;
    for (let i = 0; i < list.length; i++) {
      if (list[i].update(dt)) { this.particles.release(i); i--; }
    }
  }

  updatePickups(dt) {
    const list = this.pickups.active, p = this.player;
    for (let i = 0; i < list.length; i++) {
      const pk = list[i];
      pk.bob += dt * 4;
      const dx = p.x - pk.x, dy = p.y - pk.y, rr = p.radius + 14;
      if (dx * dx + dy * dy < rr * rr) {
        pk.item.onPickup(this);
        if (!pk.item.silent) this.onItemPickup(pk.item);
        this.pickups.release(i); i--;
      }
    }
  }

  onItemPickup(item) {
    this.sfx.item();
    this.addShake(4);
    this.showToast({ color: item.color, icon: item.icon, name: item.name, desc: item.desc });
  }

  // Baú do boss: sobe +1 em até 5 spells/buffs não-maxados (aleatórios).
  openChest() {
    const cands = [];
    for (const [id, inst] of this.abilities.owned)
      if (inst.level < SPELLS[id].maxLevel) cands.push({ kind: "spell", id, def: SPELLS[id] });
    for (const [id, lvl] of this.buffs.owned)
      if (lvl < BUFFS[id].maxLevel) cands.push({ kind: "buff", id, def: BUFFS[id] });
    for (let i = cands.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cands[i], cands[j]] = [cands[j], cands[i]];
    }

    // raridade: 1 (60%) / 3 (30%) / 5 (10%)
    const roll = Math.random();
    const rarity = roll < 0.6
      ? { count: 1, label: "Comum", color: "#cfd2dc" }
      : roll < 0.9
        ? { count: 3, label: "Raro", color: "#5acfff" }
        : { count: 5, label: "Lendário", color: "#ffd24a" };
    const picks = cands.slice(0, rarity.count);

    const results = [];
    for (const c of picks) {
      const from = c.kind === "spell" ? this.abilities.level(c.id) : this.buffs.level(c.id);
      if (c.kind === "spell") this.abilities.acquire(c.id, this.api);
      else this.buffs.acquire(c.id);
      const to = c.kind === "spell" ? this.abilities.level(c.id) : this.buffs.level(c.id);
      results.push({ def: c.def, from, to });
    }
    if (picks.length === 0) this.player.hp = this.player.maxHp; // tudo no máximo → cura total

    this.updateAbilityBar();
    this.combos.check(this.abilities, this.buffs).forEach((combo) => {
      this.sfx.combo();
      this.addShake(16);
      this.spawnParticles(this.player.x, this.player.y, combo.color, 32);
      this.player.comboPulse(combo.color);
      this.showToast(combo);
    });
    this.checkEvolution();

    this.sfx.levelUp();
    this.addShake(rarity.count >= 5 ? 16 : rarity.count >= 3 ? 10 : 6);
    if (rarity.count >= 5) this.spawnParticles(this.player.x, this.player.y, rarity.color, 28);
    let rows = "";
    if (results.length === 0) {
      rows = `<div class="chest-empty">Arsenal no máximo — cura total!</div>`;
    } else {
      for (const r of results) {
        rows += `<div class="chest-row">
          <span class="chest-ic" style="color:${r.def.color}">${r.def.icon}</span>
          <span class="chest-name">${r.def.name}</span>
          <span class="chest-lv">Lv ${r.from} → ${r.to}</span></div>`;
      }
    }
    this.ui.chestList.innerHTML = rows;
    this.ui.chestRarity.textContent = `${rarity.label} · ${rarity.count} poder${rarity.count > 1 ? "es" : ""}`;
    this.ui.chestRarity.style.color = rarity.color;
    this.state = STATE.CHEST;
    this.ui.chest.classList.remove("hidden");
  }
  closeChest() {
    this.ui.chest.classList.add("hidden");
    this.state = STATE.PLAYING;
    if (this.player.pendingLevels > 0) this.openLevelUp();
  }

  // fonte única de dano em inimigos: registra stats, propaga Corruption e combos
  damageEnemy(e, amount, source) {
    e.hp -= amount;
    e.hitFlash = 0.1;
    this.abilities.record(source, amount);

    if (source !== "corruption" && this.abilities.has("corruption")) {
      this.applyCorruption(e);
    }
    // COMBO Demonic Pact: imps curam o player com fração do dano
    if (source === "summonImp" && this.combos.has("demonicPact")) {
      const p = this.player;
      p.hp = Math.min(p.maxHp, p.hp + amount * 0.3);
    }
    // COMBO Unstable Affliction: DoT respinga dano em área (sem recursão)
    if (source === "corruption" && this.combos.has("unstableAffliction")) {
      const r = 55, splash = amount * 0.6;
      this.grid.forRadius(e.x, e.y, r, (o) => {
        if (o === e || o.hp <= 0) return;
        const dx = o.x - e.x, dy = o.y - e.y;
        if (dx * dx + dy * dy < r * r) {
          o.hp -= splash; o.hitFlash = 0.1;
          this.abilities.record("corruption", splash);
        }
      });
    }
  }

  applyCorruption(e) {
    const s = this.buffedStats(SPELLS.corruption, this.abilities.level("corruption"));
    if (e.corrTime <= 0) e.corrTickTimer = s.tickInterval; // não reinicia cadência ativa
    e.corrTime = s.duration;
    e.corrDmg = s.damage;
    e.corrTick = s.tickInterval;
    e.corrupted = true;
  }

  applyPassives(dt) {
    const p = this.player, m = this.buffs.mods;
    p.speed = p.baseSpeed * m.moveSpeed;
    p.pickupRange = p.basePickup * m.pickup;
    p.dmgReduction = m.armor;
    if (m.regen > 0) p.hp = Math.min(p.maxHp, p.hp + m.regen * dt);
  }

  updateAreas(dt) {
    const list = this.areas.active;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      a.life -= dt;
      a.tickTimer -= dt;
      if (a.tickTimer <= 0) {
        a.tickTimer += a.tickInterval;
        const dmg = a.dps * a.tickInterval;
        this.grid.forRadius(a.x, a.y, a.radius, (e) => {
          if (e.hp <= 0) return;
          const dx = e.x - a.x, dy = e.y - a.y, rr = a.radius + e.radius;
          if (dx * dx + dy * dy < rr * rr) this.damageEnemy(e, dmg, a.source);
        });
      }
      if (a.life <= 0) { this.areas.release(i); i--; }
    }
  }

  // separação leve reaproveitando o grid já populado — sem O(n²)
  separateEnemies() {
    const list = this.enemies.active;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      this.grid.forNear(e.x, e.y, (o) => {
        if (o === e) return;
        let dx = e.x - o.x, dy = e.y - o.y;
        const minD = e.radius + o.radius;
        const d2 = dx * dx + dy * dy;
        if (d2 > 0 && d2 < minD * minD) {
          const d = Math.sqrt(d2);
          const push = (minD - d) * 0.5;
          dx /= d; dy /= d;
          e.x += dx * push; e.y += dy * push;
          o.x -= dx * push; o.y -= dy * push;
        }
      });
    }
  }

  updateProjectiles(dt) {
    const list = this.projectiles.active;
    const pl = this.player;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];

      // teleguiado: curva a velocidade em direção ao inimigo mais próximo
      if (p.homing) {
        const target = this.api.nearestEnemy(p.x, p.y, 4000);
        if (target) {
          const desired = Math.atan2(target.y - p.y, target.x - p.x);
          const cur = Math.atan2(p.vy, p.vx);
          let diff = desired - cur;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const turn = Math.max(-p.turnRate * dt, Math.min(p.turnRate * dt, diff));
          const a = cur + turn;
          p.vx = Math.cos(a) * p.speed;
          p.vy = Math.sin(a) * p.speed;
        }
      }

      p.update(dt);
      if (!p.dead && p.hostile) {
        // projétil de boss → atinge o player uma vez
        const dx = pl.x - p.x, dy = pl.y - p.y, rr = pl.radius + p.radius;
        if (dx * dx + dy * dy < rr * rr) {
          pl.hp -= p.damage * (1 - pl.dmgReduction);
          p.dead = true;
          this.addShake(6);
          this.sfx.hurt();
          this.spawnParticles(pl.x, pl.y, "#ff5a5f", 8);
        }
      } else if (!p.dead) {
        this.grid.forNear(p.x, p.y, (e) => {
          if (p.dead || e.hp <= 0) return;
          const dx = e.x - p.x, dy = e.y - p.y;
          const rr = e.radius + p.radius;
          if (dx * dx + dy * dy < rr * rr) {
            if (p.hits) { if (p.hits.has(e)) return; p.hits.add(e); }
            this.damageEnemy(e, p.damage, p.source);
            if (p.pierce > 0) p.pierce--; else p.dead = true;
          }
        });
      }
      if (p.dead) { this.projectiles.release(i); i--; }
    }
  }

  killDeadEnemies() {
    const list = this.enemies.active;
    const hasCorruption = this.abilities.has("corruption");
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.hp > 0) continue;

      if (e.corrupted && hasCorruption) {
        if (this.combos.has("seedOfCorruption")) {
          // COMBO: explode em área, causa dano e espalha Corruption
          const r = 85, dmg = e.corrDmg * 4;
          this.grid.forRadius(e.x, e.y, r, (o) => {
            if (o === e || o.hp <= 0) return;
            const dx = o.x - e.x, dy = o.y - e.y;
            if (dx * dx + dy * dy < r * r) {
              o.hp -= dmg; o.hitFlash = 0.1;
              this.abilities.record("corruption", dmg);
              this.applyCorruption(o);
            }
          });
          this.areas.spawn({ x: e.x, y: e.y, radius: r, dps: 0, life: 0.35,
            tickInterval: 1, color: "#7fdc4a", source: "corruption" });
        } else {
          // base: chance de espalhar para inimigos próximos ao morrer
          const s = SPELLS.corruption.stats(this.abilities.level("corruption"));
          if (s.spreadChance > 0 && Math.random() < s.spreadChance) {
            this.grid.forRadius(e.x, e.y, 70, (o) => {
              if (o !== e && o.hp > 0) this.applyCorruption(o);
            });
          }
        }
      }

      this.orbs.spawn(e.x, e.y, e.type.xp);
      this.spawnParticles(e.x, e.y, e.type.color, e.type.boss ? 24 : 6);
      this.sfx.death();
      if (e.type.boss) this.addShake(8);
      this.player.kills++;

      // boss: chest, but at most one per bossChestCooldown — the hard phase
      // drops several Dreadlords together and one chest each would snowball.
      // Without a chest the boss pays out an extra shower of XP orbs instead.
      if (e.type.boss) {
        if (this.elapsed - this.lastBossChestAt >= BALANCE.spawn.bossChestCooldown) {
          this.lastBossChestAt = this.elapsed;
          this.pickups.spawn(e.x, e.y, "chest");
        } else {
          for (let k = 0; k < 6; k++) {
            const a = (Math.PI * 2 / 6) * k;
            this.orbs.spawn(e.x + Math.cos(a) * 26, e.y + Math.sin(a) * 26, e.type.xp);
          }
        }
      } else {
        for (const id in ITEMS) {
          if (ITEMS[id].dropChance > 0 && Math.random() < ITEMS[id].dropChance) {
            this.pickups.spawn(e.x, e.y, id);
            break;
          }
        }
      }

      this.enemies.release(i); i--;
    }
  }

  updateOrbs(dt) {
    const list = this.orbs.active;
    for (let i = 0; i < list.length; i++) {
      const collected = list[i].update(dt, this.player);
      if (collected) {
        this.player.gainXp(list[i].value * this.buffs.mods.xp);
        this.orbs.release(i); i--;
      }
    }
  }

  updateHUD() {
    const p = this.player;
    const m = Math.floor(this.elapsed / 60);
    const s = Math.floor(this.elapsed % 60);
    this.ui.timer.textContent =
      String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    this.ui.timer.classList.toggle("hard", this.elapsed >= BALANCE.spawn.hardAt);
    this.ui.kills.textContent = "☠ " + p.kills;
    this.ui.hpFill.style.width = (p.hp / p.maxHp * 100) + "%";
    this.ui.xpFill.style.width = (p.xp / p.xpToNext * 100) + "%";
    this.ui.hpLabel.textContent = Math.ceil(p.hp) + " / " + p.maxHp;
    this.ui.xpLabel.textContent = "Nível " + p.level;
  }

  render() {
    const ctx = this.ctx;
    if (this.state === STATE.MENU) {
      // fundo animado leve no menu
      this.camera.x += 12 * (1 / 60);
      this.camera.drawGround(ctx);
      this.renderComboPreview();
      return;
    }
    this.camera.drawGround(ctx);

    const areas = this.areas.active;
    for (let i = 0; i < areas.length; i++) areas[i].draw(ctx, this.camera);

    const orbs = this.orbs.active;
    for (let i = 0; i < orbs.length; i++) orbs[i].draw(ctx, this.camera);

    const pickups = this.pickups.active;
    for (let i = 0; i < pickups.length; i++) pickups[i].draw(ctx, this.camera);

    const enemies = this.enemies.active;
    for (let i = 0; i < enemies.length; i++) enemies[i].draw(ctx, this.camera);

    const parts = this.particles.active;
    for (let i = 0; i < parts.length; i++) parts[i].draw(ctx, this.camera);

    this.player.draw(ctx, this.camera, this.combos, this.abilities);

    const proj = this.projectiles.active;
    for (let i = 0; i < proj.length; i++) proj[i].draw(ctx, this.camera);

    // feixes, imps e auras das habilidades
    this.abilities.draw(ctx, this.api, this.camera);
  }
}

window.addEventListener("DOMContentLoaded", () => new Game());
</script>
</body>
