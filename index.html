<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WoW Survivors — Warlock</title>
<style>
  :root {
    --fel: #6fdc4a;
    --fel-dim: #3a7a26;
    --shadow: #7a3cff;
    --shadow-dim: #2a1147;
    --bg: #0a0710;
    --panel: rgba(18, 10, 30, 0.92);
    --text: #d8cce8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    user-select: none;
    cursor: default;
  }

  #game {
    position: fixed;
    inset: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- HUD overlay ---------- */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .hud-top {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  #timer {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 12px var(--shadow), 0 2px 4px #000;
  }

  /* hard phase (5 min+): the clock turns into a warning */
  #timer.hard {
    color: #ff6b8a;
    text-shadow: 0 0 14px #ff3b6b, 0 2px 4px #000;
    animation: timer-pulse 1.6s ease-in-out infinite;
  }

  @keyframes timer-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.62; }
  }

  #kills {
    font-size: 14px;
    color: var(--fel);
    text-shadow: 0 0 8px var(--fel-dim), 0 1px 2px #000;
    margin-top: 2px;
  }

  /* bottom bars */
  .bars {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    width: min(520px, 90vw);
  }

  .bar {
    height: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    background: rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    margin-top: 6px;
  }

  .bar > .fill {
    height: 100%;
    width: 100%;
    transition: width 0.12s linear;
  }

  #hpFill { background: linear-gradient(90deg, #c1272d, #ff5a5f); }
  #xpFill { background: linear-gradient(90deg, var(--shadow-dim), var(--shadow)); }

  .bar > .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 0 1px 2px #000;
  }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(42,17,71,0.65), rgba(10,7,16,0.97));
    backdrop-filter: blur(2px);
  }

  .screen.hidden { display: none; }

  .title {
    font-size: clamp(38px, 7vw, 76px);
    font-weight: bold;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #fff, var(--shadow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(122,60,255,0.5);
  }

  .subtitle {
    color: var(--fel);
    letter-spacing: 6px;
    text-transform: uppercase;
    font-size: 14px;
    margin-top: 4px;
    margin-bottom: 36px;
    text-shadow: 0 0 10px var(--fel-dim);
  }

  .class-grid {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 36px;
  }

  .class-card {
    width: 150px;
    padding: 18px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: var(--panel);
    text-align: center;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }

  .class-card.available { cursor: pointer; pointer-events: auto; }
  .class-card.available:hover { transform: translateY(-4px); }
  .class-card.selected {
    border-color: var(--shadow);
    box-shadow: 0 0 24px rgba(122,60,255,0.5);
  }
  .class-card.locked { opacity: 0.4; }

  .class-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 10px;
    border-radius: 50%;
  }

  .class-name { font-size: 18px; font-weight: bold; }
  .class-tag { font-size: 11px; color: #9a8ab0; margin-top: 4px; }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .speed-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #9a8ab0;
    margin-right: 4px;
  }
  .speed-btn {
    pointer-events: auto;
    cursor: pointer;
    width: 48px;
    padding: 8px 0;
    font-size: 15px;
    font-weight: bold;
    color: var(--text);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    transition: transform 0.1s, border-color 0.1s, color 0.1s;
  }
  .speed-btn:hover { transform: translateY(-2px); }
  .speed-btn.active {
    color: #fff;
    border-color: var(--fel);
    box-shadow: 0 0 14px rgba(111,220,74,0.4);
  }

  .combo-block {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .combo-preview {
    width: 132px;
    height: 132px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: #0d0a16;
  }
  .combo-side {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
  }
  .combo-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 268px;
  }
  .combo-btn {
    pointer-events: auto;
    cursor: pointer;
    width: 34px;
    height: 34px;
    font-size: 15px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
  }
  .combo-btn:hover { transform: translateY(-2px); }
  .combo-btn.wide {
    width: auto;
    padding: 0 12px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .combo-hint { font-size: 11px; color: #9a8ab0; }

  .btn {
    pointer-events: auto;
    cursor: pointer;
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(180deg, var(--shadow), var(--shadow-dim));
    border: 1px solid var(--shadow);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(122,60,255,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(122,60,255,0.7); }
  .btn:active { transform: translateY(0); }

  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: #7a6a90;
    letter-spacing: 1px;
  }

  .btn-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 220px;
  }
  .btn-col .btn { width: 100%; }

  .chest-list {
    width: min(340px, 86vw);
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chest-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px;
    animation: toastIn 0.3s ease;
  }
  .chest-ic { font-size: 20px; width: 24px; text-align: center; }
  .chest-name { flex: 1; font-weight: bold; color: #fff; }
  .chest-lv { font-size: 13px; color: var(--fel); font-weight: bold; }
  .chest-empty { text-align: center; color: var(--fel); font-size: 16px; padding: 12px; }

  .stats-box {
    width: min(320px, 80vw);
    margin-bottom: 32px;
  }
  .stats-box .stat {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 15px;
  }
  .stats-box .stat span { color: #9a8ab0; }
  .stats-box .stat b { color: #fff; }
  .stats-box .stat-head {
    margin-top: 14px; padding: 6px 14px 2px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--fel);
  }

  /* ---------- Pause: grimório de poderes ---------- */
  #pause {
    justify-content: flex-start;
    padding: 22px 16px 24px;
    overflow-y: auto;
  }
  #pause .subtitle { margin-bottom: 18px; }

  .pause-panel {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    width: min(1000px, 96vw);
    pointer-events: auto;
  }

  .pause-col {
    flex: 1 1 320px;
    min-width: 290px;
    max-width: 480px;
    max-height: calc(100vh - 250px);
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(122,60,255,0.6) transparent;
  }
  .pause-col::-webkit-scrollbar { width: 6px; }
  .pause-col::-webkit-scrollbar-thumb {
    background: rgba(122,60,255,0.6);
    border-radius: 3px;
  }

  .pause-head {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fel);
    text-shadow: 0 0 10px var(--fel-dim);
    margin: 0 0 8px 2px;
  }
  .pause-head + .pause-head, .pause-col > .pause-head ~ .pause-head { margin-top: 16px; }
  .pause-empty {
    padding: 10px 12px;
    font-size: 13px;
    color: #7a6a90;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 9px;
  }

  /* linha de poder (spell ou buff) */
  .pw-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 11px;
    margin-bottom: 6px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px;
  }
  .pw-ic {
    width: 30px; height: 30px;
    flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    border: 1px solid;
    border-radius: 7px;
    background: rgba(0,0,0,0.45);
  }
  .pw-body { flex: 1; min-width: 0; }
  .pw-top { display: flex; align-items: baseline; gap: 8px; }
  .pw-name { font-weight: bold; color: #fff; font-size: 14px; }
  .pw-lv {
    margin-left: auto;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #9a8ab0;
  }
  .pw-lv.max { color: var(--fel); text-shadow: 0 0 8px var(--fel-dim); }
  .pw-bar {
    height: 5px;
    margin: 5px 0 4px;
    border-radius: 3px;
    background: rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .pw-fill { height: 100%; border-radius: 3px; }
  .pw-next { font-size: 11.5px; color: #b8a8d0; line-height: 1.35; }
  .pw-next b { color: #fff; }

  /* combos */
  .cb-row {
    padding: 9px 11px;
    margin-bottom: 7px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px;
  }
  .cb-row.done { background: rgba(24, 14, 40, 0.95); }
  .cb-row.far { opacity: 0.55; }
  .cb-head { display: flex; align-items: center; gap: 7px; }
  .cb-ic { font-size: 16px; }
  .cb-name { font-weight: bold; color: #fff; font-size: 14px; }
  .cb-status {
    margin-left: auto;
    font-size: 10.5px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9a8ab0;
    white-space: nowrap;
  }
  .cb-status.on { color: var(--fel); text-shadow: 0 0 8px var(--fel-dim); }
  .cb-status.close { color: #ffd24a; }
  .cb-desc { font-size: 11.5px; color: #b8a8d0; line-height: 1.35; margin-top: 3px; }
  .cb-bar {
    height: 5px;
    margin: 6px 0 6px;
    border-radius: 3px;
    background: rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .cb-fill { height: 100%; border-radius: 3px; }
  .cb-req { display: flex; flex-wrap: wrap; gap: 6px; }
  .cb-req-row {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    font-size: 11px;
    color: #9a8ab0;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
  }
  .cb-req-row b { color: #fff; font-size: 11px; }
  .cb-req-row.ok { color: var(--fel); border-color: rgba(111,220,74,0.45); }
  .cb-req-row.ok b { color: var(--fel); }

  @media (max-width: 760px) {
    .pause-col { max-height: none; overflow-y: visible; }
  }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
  }
  .btn-sm { padding: 11px 26px; font-size: 14px; }

  /* ability bars (HUD) — spells em cima, buffs embaixo */
  #abilityBar, #buffBar {
    position: absolute;
    left: 14px;
    display: flex;
    gap: 6px;
  }
  #abilityBar { top: 14px; }
  #buffBar { top: 60px; }
  #buffBar .ab-icon { width: 30px; height: 30px; font-size: 15px; }
  .ab-icon {
    width: 38px; height: 38px;
    border: 1.5px solid #555;
    border-radius: 8px;
    background: rgba(10,7,16,0.8);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    font-size: 20px;
  }
  .ab-icon b {
    position: absolute;
    right: -4px; bottom: -6px;
    font-size: 11px;
    background: var(--shadow-dim);
    color: #fff;
    border-radius: 6px;
    padding: 0 4px;
    border: 1px solid var(--shadow);
  }

  /* level-up cards */
  .cards {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .card {
    pointer-events: auto;
    cursor: pointer;
    width: 200px;
    padding: 22px 18px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    background: var(--panel);
    text-align: center;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: var(--shadow);
    box-shadow: 0 0 28px rgba(122,60,255,0.5);
  }
  .card { position: relative; }
  .card-spell:hover { border-color: var(--shadow); box-shadow: 0 0 28px rgba(122,60,255,0.5); }
  .card-buff:hover { border-color: var(--fel); box-shadow: 0 0 28px rgba(111,220,74,0.4); }
  .card-kind {
    position: absolute; top: 10px; right: 10px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px; font-weight: bold;
  }
  .card-spell .card-kind { background: rgba(122,60,255,0.25); color: #c9aaff; }
  .card-buff .card-kind { background: rgba(111,220,74,0.2); color: #a6e88a; }
  .card-icon { font-size: 40px; margin-bottom: 8px; }
  .card-name { font-size: 19px; font-weight: bold; color: #fff; }
  .card-level {
    font-size: 12px; letter-spacing: 1px; color: var(--fel);
    margin: 4px 0 12px; text-transform: uppercase;
  }
  .card-desc { font-size: 13px; color: #b8a8d0; line-height: 1.4; }
  .card-combo {
    margin-top: 10px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 5px 8px;
    border: 1px solid;
    border-radius: 7px;
    background: rgba(0,0,0,0.3);
  }
  .card-combo.ready {
    background: rgba(255,255,255,0.06);
    animation: comboPulse 1s ease-in-out infinite;
  }
  @keyframes comboPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    50% { box-shadow: 0 0 14px currentColor; }
  }

  /* damage meter (HUD) */
  #dmgHud {
    position: absolute;
    left: 14px;
    bottom: 16px;
    width: 168px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dmg-row { display: flex; align-items: center; gap: 6px; }
  .dmg-ic { font-size: 15px; width: 18px; text-align: center; flex: none; }
  .dmg-bar {
    position: relative;
    flex: 1;
    height: 15px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px;
    overflow: hidden;
  }
  .dmg-fill { position: absolute; inset: 0; opacity: 0.45; border-radius: 5px; transition: width 0.2s linear; }
  .dmg-val {
    position: absolute; right: 5px; top: 0; line-height: 15px;
    font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000;
  }

  /* combo toasts */
  #toasts {
    position: absolute;
    top: 70px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
  }
  .toast {
    width: 260px;
    padding: 12px 14px;
    border: 1px solid #555;
    border-left-width: 4px;
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    animation: toastIn 0.35s ease, toastOut 0.5s ease 4.7s forwards;
  }
  .toast-head {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #9a8ab0;
  }
  .toast-name { font-size: 17px; font-weight: bold; color: #fff; margin: 2px 0 4px; }
  .toast-desc { font-size: 12px; color: #b8a8d0; line-height: 1.35; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(40px); }
  }
</style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
  </div>

  <!-- HUD overlay (HTML over canvas) -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div id="timer">00:00</div>
      <div id="kills">☠ 0</div>
    </div>
    <div id="abilityBar"></div>
    <div id="buffBar"></div>
    <div id="toasts"></div>
    <div id="dmgHud"></div>
    <div class="bars">
      <div class="bar"><div id="hpFill" class="fill"></div><div class="label" id="hpLabel">100 / 100</div></div>
      <div class="bar"><div id="xpFill" class="fill"></div><div class="label" id="xpLabel">Nível 1</div></div>
    </div>
  </div>

  <!-- Start menu -->
  <div id="menu" class="screen">
    <div class="title">WoW Survivors</div>
    <div class="subtitle">Affliction</div>
    <div class="class-grid" id="classGrid"></div>
    <div class="speed-row" id="speedRow">
      <span class="speed-label">Velocidade</span>
      <button class="speed-btn active" data-spd="1">1x</button>
      <button class="speed-btn" data-spd="2">2x</button>
      <button class="speed-btn" data-spd="3">3x</button>
    </div>
    <div class="combo-block" id="comboBlock">
      <canvas id="comboPreview" class="combo-preview"></canvas>
      <div class="combo-side">
        <span class="speed-label">Combos — visual</span>
        <div class="combo-toggles" id="comboToggles"></div>
        <span class="combo-hint">Liga só o efeito visual, sem mudar o jogo.</span>
      </div>
    </div>
    <button class="btn" id="startBtn">Iniciar</button>
    <div class="hint">Mover: WASD / Setas &nbsp;·&nbsp; Som: M</div>
  </div>

  <!-- Level up -->
  <div id="levelup" class="screen hidden">
    <div class="title" style="font-size:clamp(28px,5vw,48px)">Subiu de Nível!</div>
    <div class="subtitle">Escolha um poder</div>
    <div id="cards" class="cards"></div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hidden">
    <div class="title" style="font-size:clamp(28px,5vw,48px)">Pausado</div>
    <div class="subtitle">ESC para voltar</div>
    <div id="pausePanel" class="pause-panel"></div>
    <div class="btn-row">
      <button class="btn btn-sm" id="resumeBtn">Continuar</button>
      <button class="btn btn-sm" id="pauseRestartBtn">Reiniciar</button>
      <button class="btn btn-sm" id="quitBtn">Sair</button>
    </div>
  </div>

  <!-- Chest (boss) -->
  <div id="chest" class="screen hidden">
    <div class="title" style="font-size:clamp(28px,5vw,46px)">📦 Baú do Dreadlord</div>
    <div class="subtitle" id="chestRarity">Poderes amplificados</div>
    <div id="chestList" class="chest-list"></div>
    <button class="btn" id="chestBtn">Continuar</button>
  </div>

  <!-- Game over -->

<script>
"use strict";

/* =========================================================================

const BALANCE = {

    hardAt: 300,             // second gear kicks in here (5 min)

    hardMinInterval: 0.09,   // new floor for the interval
    hardHpGrowth: 0.19,      // +19% HP per ramp (every 15s)
    hardDmgGrowth: 0.06,     // +6% touch damage per ramp
    hardSpeedGrowth: 0.02,   // +2% enemy speed per ramp
    hardMaxAlive: 480,       // alive cap rises alongside
    hardWaveEvery: 50,       // dense waves nearly twice as frequent
    hardBossEvery: 75,       // Dreadlords every 75s
    hardBossStack: 150,      // every Xs past hardAt, +1 Dreadlord per summon
    maxBossStack: 3,         // cap on Dreadlords per summon
    bossChestCooldown: 60,   // min seconds between boss chests (anti-snowball)
    // No enemy may exceed this fraction of the player's speed: the pressure
    // comes from density, not from taking kiting off the table.
    speedCap: 0.9,
  },
};

// Inimigos como data. radius, hp, speed, touchDps, color, weight (peso de spawn).

// Classes como data. Só Warlock jogável no MVP; resto é placeholder de UI.
const CLASSES = {

/* SPELLS (linha 1: armas/feitiços ativos). Cada uma:
   id, name, tags, icon, color, maxLevel
   stats(level)  -> números BASE daquele nível
   desc(level)   -> texto do efeito ao ADQUIRIR/SUBIR para `level`
   tick(dt, api, inst) -> auto-cast (inst = {level, timer})
   Use api.stats(this, level) no tick p/ obter os stats JÁ com os buffs globais.
   Campos de dano padronizados em `damage`/`dps` p/ os buffs pegarem. */
const SPELLS = {
  shadowBolt: {
    id: "shadowBolt", name: "Shadow Bolt", tags: ["shadow"],
    icon: "✦", color: "#a06bff", maxLevel: 5,
    stats(l) {
      return {
        damage: 8 + l * 6,
        count: 1 + Math.floor(l / 2),       // L1:1  L2:2  L4:3  ...
        cooldown: Math.max(0.28, 0.95 - (l - 1) * 0.11),
        speed: 540,
        range: 560,
        radius: 6,
      };
    },
    desc(l) {
      if (l === 1) return "Dispara um projétil sombrio no inimigo mais próximo.";
      const prev = this.stats(l - 1), s = this.stats(l);
      const bits = [];
      if (s.damage !== prev.damage) bits.push(`dano ${prev.damage}→${s.damage}`);
      if (s.count !== prev.count) bits.push(`+1 projétil (${s.count})`);
      if (s.cooldown !== prev.cooldown) bits.push("cast mais rápido");
      return bits.join(", ") + ".";
    },
    tick(dt, api, inst) {
      inst.timer -= dt;
      if (inst.timer > 0) return;
      const s = api.stats(this, inst.level);
      const target = api.nearestEnemy(api.player.x, api.player.y, s.range);
      if (!target) return;
      inst.timer = s.cooldown;
      const base = Math.atan2(target.y - api.player.y, target.x - api.player.x);

      // COMBO: vira um único Chaos Bolt massivo e perfurante
      // (s.damage já vem empoderado pelo combo via api.stats)
      if (api.hasCombo("chaosBolt")) {
        api.fireProjectile({
          x: api.player.x, y: api.player.y,
          vx: Math.cos(base) * s.speed * 0.9, vy: Math.sin(base) * s.speed * 0.9,
          damage: s.damage * 2, radius: s.radius * 2, color: "#ff4040",
          source: this.id, life: 1.8, pierce: 20, trail: 210,
        });
        return;
      }

      for (let i = 0; i < s.count; i++) {
        const spread = (i - (s.count - 1) / 2) * 0.14;
        const a = base + spread;
        api.fireProjectile({
          x: api.player.x, y: api.player.y,
          vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed,
          damage: s.damage, radius: s.radius,
          color: this.color, source: this.id, life: 2.6, pierce: 0,
          homing: true, speed: s.speed, turnRate: 10, trail: 150,
        });
      }
    },
  },

  // DoT aplicado quando QUALQUER ataque acerta (via Game.damageEnemy). Sem auto-cast.
  corruption: {
    id: "corruption", name: "Corruption", tags: ["shadow", "dot"],
    icon: "☠", color: "#7fdc4a", maxLevel: 5,
    stats(l) {
      return {
        damage: Math.round(2 + l * 1.6),
        duration: 3 + l * 0.6,
        tickInterval: 0.5,
        spreadChance: l >= 3 ? 0.1 + (l - 3) * 0.1 : 0,
      };
    },
    desc(l) {
      if (l === 1) return "Ataques aplicam um DoT sombrio nos inimigos.";
      const s = this.stats(l), p = this.stats(l - 1), b = [];
      if (s.damage !== p.damage) b.push(`dano/tick ${p.damage}→${s.damage}`);
      if (s.duration !== p.duration) b.push("duração maior");
      if (s.spreadChance > p.spreadChance) b.push(`${Math.round(s.spreadChance * 100)}% espalhar ao morrer`);
      return b.join(", ") + ".";
    },
    tick() {},
    // Rot clinging to the warlock: corrupted ground, rot orbs on a tilted orbit
    // and a sickly green pulse on the sprite. Density follows the spell level.
    vfx: {
      under(ctx, p) {
        // flare curto a cada 0.5s: mesma cadência do tick do DoT
        const flare = Math.pow(1 - ((p.t % 0.5) / 0.5), 3);
        const k = 0.9 + Math.sin(p.t * 2.2) * 0.1 + flare * 0.12;
        const cy = p.y + p.r * 0.9, R = p.r * 1.9 * k;
        const g = ctx.createRadialGradient(p.x, cy, 0, p.x, cy, R);
        g.addColorStop(0, `rgba(127,220,74,${(0.3 + flare * 0.22).toFixed(2)})`);
        g.addColorStop(0.5, "rgba(96,180,52,0.14)");
        g.addColorStop(1, "rgba(60,140,40,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(p.x, cy, R, R * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        // anel apodrecido girando no chão
        ctx.save();
        ctx.translate(p.x, cy);
        ctx.scale(1, 0.4);
        ctx.rotate(-p.t * 0.6);
        ctx.strokeStyle = `rgba(127,220,74,${(0.48 + flare * 0.35).toFixed(2)})`;
        ctx.lineWidth = 1.6 + flare;
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(0, 0, R * 0.95, a, a + 0.32);
          ctx.stroke();
        }
        ctx.restore();

        drawRotOrbit(ctx, p, false);
      },
      over(ctx, p) {
        const lvl = p.lvl || 1;

        // o próprio personagem apodrece, respirando no ritmo do DoT
        const breathe = (Math.sin(p.t * 2.6) + 1) * 0.5;
        drawSpriteGlow(ctx, p.spr, p.x, p.y, p.drawH, p.flip, p.anim,
          "#7fdc4a", 0.08 + breathe * 0.12 + lvl * 0.01);

        drawRotOrbit(ctx, p, true);

        // esporos se soltando do corpo
        ctx.fillStyle = "#9ff05c";
        for (let i = 0; i < 3 + lvl; i++) {
          const seed = vfxRand(i * 11 + 7);
          const ph = (p.t * (0.5 + seed * 0.4) + seed) % 1;
          const px = p.x + (seed - 0.5) * p.r * 2.1;
          const py = p.y - p.r * 0.4 + ph * p.r * 1.9;
          ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.6;
          ctx.beginPath();
          ctx.ellipse(px, py, 1.3, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      },
    },
  },

  rainOfFire: {
    id: "rainOfFire", name: "Rain of Fire", tags: ["fire"],
    icon: "🔥", color: "#ff7a2c", maxLevel: 5,
    stats(l) {
      return {
        radius: 55 + l * 9,
        dps: 12 + l * 7,
        life: 3,
        cooldown: Math.max(1.2, 4 - (l - 1) * 0.45),
        tickInterval: Math.max(0.18, 0.4 - (l - 1) * 0.04),
      };
    },
    desc(l) {
      if (l === 1) return "Faz chover fogo numa área próxima.";
      const s = this.stats(l), p = this.stats(l - 1), b = [];
      if (s.dps !== p.dps) b.push(`dano ${p.dps}→${s.dps}`);
      if (s.radius !== p.radius) b.push("raio maior");
      if (s.cooldown !== p.cooldown) b.push("mais frequente");
      return b.join(", ") + ".";
    },
    tick(dt, api, inst) {
      inst.timer -= dt;
      if (inst.timer > 0) return;
      const s = api.stats(this, inst.level);
      inst.timer = s.cooldown;
      const drops = api.hasCombo("cataclysm") ? 2 : 1; // COMBO: chuva dupla
      for (let k = 0; k < drops; k++) {
        const a = Math.random() * Math.PI * 2, d = Math.random() * 120;
        api.spawnArea({
          x: api.player.x + Math.cos(a) * d, y: api.player.y + Math.sin(a) * d,
          radius: s.radius, dps: s.dps, life: s.life,
          tickInterval: s.tickInterval, color: this.color, source: this.id,
        });
      }
    },
  },

  drainLife: {
    id: "drainLife", name: "Drain Life", tags: ["shadow"],
    icon: "⚕", color: "#c850ff", maxLevel: 5,
    stats(l) {
      return {
        dps: 20 + l * 10,
        healFrac: 0.22 + l * 0.02,
        range: 180 + l * 16,
        targets: 1 + Math.floor((l - 1) / 2),
      };
    },
    desc(l) {
      if (l === 1) return "Canaliza dano num inimigo próximo e se cura.";
      const s = this.stats(l), p = this.stats(l - 1), b = [];
      if (s.dps !== p.dps) b.push(`dano ${p.dps}→${s.dps}`);
      if (s.targets !== p.targets) b.push(`+1 alvo (${s.targets})`);
      if (s.range !== p.range) b.push("alcance maior");
      return b.join(", ") + ".";
    },
    tick(dt, api, inst) {
      const s = api.stats(this, inst.level);
      const targets = api.nearestEnemies(api.player.x, api.player.y, s.range, s.targets);
      inst.beams = targets;
      const healMul = api.hasCombo("soulLeech") ? 3 : 1; // COMBO: cura amplificada
      for (const e of targets) {
        const dmg = s.dps * dt;
        api.damageEnemy(e, dmg, this.id);
        api.heal(dmg * s.healFrac * healMul);
      }
    },
    draw(ctx, api, inst, cam) {
      if (!inst.beams) return;
      const px = api.player.x - cam.left, py = api.player.y - cam.top;
      for (const e of inst.beams) {
        if (e.hp <= 0) continue;
        const ex = e.x - cam.left, ey = e.y - cam.top;
        ctx.strokeStyle = "rgba(200,80,255,0.65)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
      }
    },
  },

  summonImp: {
    id: "summonImp", name: "Summon Imp", tags: ["summon", "fire"],
    icon: "👹", color: "#ff5a3c", maxLevel: 5,
    stats(l) {
      return {
        impCount: 1 + Math.floor((l - 1) / 2),
        damage: 5 + l * 3,
        cooldown: Math.max(0.5, 1.3 - (l - 1) * 0.14),
        range: 280, speed: 380, radius: 5,
      };
    },
    desc(l) {
      if (l === 1) return "Invoca um imp que ataca inimigos com bolas de fogo.";
      const s = this.stats(l), p = this.stats(l - 1), b = [];
      if (s.impCount !== p.impCount) b.push(`+1 imp (${s.impCount})`);
      if (s.damage !== p.damage) b.push(`dano ${p.damage}→${s.damage}`);
      if (s.cooldown !== p.cooldown) b.push("ataca mais rápido");
      return b.join(", ") + ".";
    },
    onChange(inst, api) {
      const s = this.stats(inst.level);
      inst.imps = inst.imps || [];
      const sep = (Math.PI * 2) / s.impCount;
      while (inst.imps.length < s.impCount) {
        inst.imps.push({ angle: sep * inst.imps.length, x: api.player.x, y: api.player.y, cd: 0 });
      }
    },
    tick(dt, api, inst) {
      if (!inst.imps) return;
      const s = api.stats(this, inst.level), R = 72;
      for (const imp of inst.imps) {
        imp.angle += dt * 1.4;
        const tx = api.player.x + Math.cos(imp.angle) * R;
        const ty = api.player.y + Math.sin(imp.angle) * R;
        const k = Math.min(1, dt * 8);
        imp.x += (tx - imp.x) * k; imp.y += (ty - imp.y) * k;
        imp.cd -= dt;
        if (imp.cd <= 0) {
          const target = api.nearestEnemy(imp.x, imp.y, s.range);
          if (target) {
            imp.cd = s.cooldown;
            const a = Math.atan2(target.y - imp.y, target.x - imp.x);
            api.fireProjectile({
              x: imp.x, y: imp.y,
              vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed,
              damage: s.damage, radius: s.radius, color: "#ff8a3c",
              source: this.id, life: 1.6, pierce: 0,
            });
          }
        }
      }
    },
    draw(ctx, api, inst, cam) {
      if (!inst.imps) return;
      for (const imp of inst.imps) {
        const sx = imp.x - cam.left, sy = imp.y - cam.top;
        const g = ctx.createRadialGradient(sx - 2, sy - 2, 1, sx, sy, 8);
        g.addColorStop(0, "#ffce8a"); g.addColorStop(1, "#a52a14");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd24a";
        ctx.beginPath();
        ctx.arc(sx - 2.5, sy - 1, 1.5, 0, Math.PI * 2);
        ctx.arc(sx + 2.5, sy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    },
  },

  curseOfAgony: {
    id: "curseOfAgony", name: "Curse of Agony", tags: ["shadow"],
    icon: "◎", color: "#9a4cff", maxLevel: 5,
    stats(l) {
      return { radius: 78 + l * 12, dps: 7 + l * 3, ramp: 0.12 + l * 0.03 };
    },
    desc(l) {
      if (l === 1) return "Aura que causa dano crescente em quem fica perto.";
      const s = this.stats(l), p = this.stats(l - 1), b = [];
      if (s.radius !== p.radius) b.push("raio maior");
      if (s.dps !== p.dps || s.ramp !== p.ramp) b.push("dano/ramp maior");
      return b.join(", ") + ".";
    },
    tick(dt, api, inst) {
      const s = api.stats(this, inst.level), px = api.player.x, py = api.player.y;
      const ramp = s.ramp * (api.hasCombo("pandemic") ? 2.5 : 1); // COMBO: ramp acelerado
      api.forEnemiesInRadius(px, py, s.radius, (e) => {
        if (e.hp <= 0) return;
        const dx = e.x - px, dy = e.y - py, rr = s.radius + e.radius;
        if (dx * dx + dy * dy > rr * rr) return;
        e.curseTime += dt;
        api.damageEnemy(e, s.dps * (1 + e.curseTime * ramp) * dt, this.id);
      });
    },
    draw(ctx, api, inst, cam) {
      const s = api.stats(this, inst.level); // buffado: aura visual acompanha a área
      const sx = api.player.x - cam.left, sy = api.player.y - cam.top;
      const g = ctx.createRadialGradient(sx, sy, s.radius * 0.3, sx, sy, s.radius);
      g.addColorStop(0, "rgba(154,76,255,0)");
      g.addColorStop(0.8, "rgba(154,76,255,0.05)");
      g.addColorStop(1, "rgba(154,76,255,0.14)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, s.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(154,76,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
    },
  },

};

/* BUFFS (linha 2: modificadores globais, valem para TODAS as spells/player).
   apply(m, level) muta o objeto de modifiers agregado;
   desc(level) descreve o valor acumulado naquele nível. */
const BUFFS = {
  empower: {
    id: "empower", name: "Fel Empowerment", icon: "⚔", color: "#ff6b6b", maxLevel: 5,
    apply(m, l) { m.damage *= 1 + 0.12 * l; },
    desc(l) { return `+${Math.round(0.12 * l * 100)}% de dano em tudo.`; },
  },
  haste: {
    id: "haste", name: "Unholy Haste", icon: "⚡", color: "#ffd24a", maxLevel: 5,
    apply(m, l) { m.cooldown *= 1 - 0.07 * l; },
    desc(l) { return `+${Math.round(0.07 * l * 100)}% velocidade de ataque (e frequência de DoT).`; },
  },
  multicast: {
    id: "multicast", name: "Soul Splinter", icon: "⁂", color: "#a06bff", maxLevel: 5,
    apply(m, l) { m.projectiles += Math.ceil(l / 2); },
    desc(l) { return `+${Math.ceil(l / 2)} projétil em spells de projétil.`; },
  },
  expansion: {
    id: "expansion", name: "Demonic Reach", icon: "⊕", color: "#5acfff", maxLevel: 5,
    apply(m, l) { m.area *= 1 + 0.13 * l; },
    desc(l) { return `+${Math.round(0.13 * l * 100)}% de área.`; },
  },
  affliction: {
    id: "affliction", name: "Lingering Affliction", icon: "⌛", color: "#7fdc4a", maxLevel: 5,
    apply(m, l) { m.duration *= 1 + 0.16 * l; },
    desc(l) { return `+${Math.round(0.16 * l * 100)}% de duração de DoT/áreas.`; },
  },
  swiftness: {
    id: "swiftness", name: "Demonic Swiftness", icon: "➤", color: "#9fe6ff", maxLevel: 5,
    apply(m, l) { m.moveSpeed *= 1 + 0.07 * l; },
    desc(l) { return `+${Math.round(0.07 * l * 100)}% de velocidade de movimento.`; },

// XP necessária para sair do nível `l` (lvl 1 = 1 orbe; ramp suave depois)
function xpForLevel(l) {
  return Math.floor(1 + (l - 1) * 2 + (l - 1) * (l - 1) * 0.4);
}

// número compacto: 1234 -> "1.2k", 2.5e6 -> "2.5M"
function fmtNum(n) {
  n = Math.round(n);
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return "" + n;
}

// "#rrggbb" -> "r,g,b" (para montar rgba com alpha variável)
function hexRgb(h) {
  const n = parseInt(h.replace("#", ""), 16);
  return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
}

/* =========================================================================
   ASSETS — pixel-art e textura gerados em runtime (sem arquivos externos)
   ========================================================================= */

let SPRITES = {}; // id -> { canvas, white }  (white = silhueta p/ flash de dano)

// Renderiza um grid de pixels (linhas de texto) em um canvas. '.'/' ' = transparente.
function makeSprite(rows, pal) {
  const w = Math.max(...rows.map((r) => r.length)), h = rows.length;
  const build = (whiteOnly) => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    for (let r = 0; r < h; r++) {
      const row = rows[r];
      for (let col = 0; col < row.length; col++) {
        const ch = row[col];
        if (ch === "." || ch === " ") continue;
        const color = whiteOnly ? "#ffffff" : pal[ch];
        if (!color) continue;
        x.fillStyle = color;
        x.fillRect(col, r, 1, 1);
      }
    }
    return c;
  };
  return { canvas: build(false), white: build(true) };
}

// Blob radial suave (cacheado por cor) usado nos rastros — evita recriar gradient por frame.
const GLOW_BLOBS = new Map();
function glowBlob(color) {
  let c = GLOW_BLOBS.get(color);
  if (c) return c;
  const size = 64, h = size / 2;
  c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  const rgb = hexRgb(color);
  const g = x.createRadialGradient(h, h, 0, h, h, h);
  g.addColorStop(0, `rgba(${rgb},1)`);
  g.addColorStop(0.35, `rgba(${rgb},0.45)`);
  g.addColorStop(0.7, `rgba(${rgb},0.12)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  GLOW_BLOBS.set(color, c);
  return c;
}

// transform de caminhada (hop + squash/stretch + gingado). `anim` é aplicado no draw.
function walkAnim(t, moving) {
  if (!moving) {
    const b = Math.sin(t * 2);          // respiração idle
    return { bob: 0, sclX: 1 - b * 0.015, sclY: 1 + b * 0.025, rot: 0 };
  }
  const ph = t * 9;
  const hop = Math.abs(Math.sin(ph));   // 0..1 — pico = pé no chão
  return {
    bob: -hop * 2.5,                    // sobe ao pisar
    sclX: 1 - hop * 0.05,
    sclY: 1 + hop * 0.07,
    rot: Math.sin(ph) * 0.05,           // gingado leve
  };
}

// sombra elíptica no chão (não acompanha o hop → reforça profundidade)
function drawShadow(ctx, cx, cy, r) {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.85, r * 0.8, r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// desenha um sprite centrado em (cx,cy), altura drawH, com flip/flash/animação
function drawSprite(ctx, spr, cx, cy, drawH, flip, flashAlpha, anim) {
  const s = drawH / spr.canvas.height;
  const w = spr.canvas.width * s, h = drawH;
  const a = anim || NO_ANIM;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(cx, cy + a.bob);
  if (a.rot) ctx.rotate(a.rot);
  ctx.scale((flip ? -1 : 1) * a.sclX, a.sclY);
  ctx.drawImage(spr.canvas, -w / 2, -h / 2, w, h);
  if (flashAlpha > 0) {
    ctx.globalAlpha = flashAlpha;
    ctx.drawImage(spr.white, -w / 2, -h / 2, w, h);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
const NO_ANIM = { bob: 0, sclX: 1, sclY: 1, rot: 0 };

/* ---- VFX de combo: adornos desenhados sob/sobre o personagem ---- */

// Deterministic 0..1 noise per index, so the vfx stays stable and allocates nothing.
function vfxRand(i) {
  const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// Sprite silhouette painted in a solid color, cached per sprite+color.
function tintedSprite(spr, color) {
  const cache = spr.tints || (spr.tints = {});
  if (cache[color]) return cache[color];
  const c = document.createElement("canvas");
  c.width = spr.white.width; c.height = spr.white.height;
  const x = c.getContext("2d");
  x.drawImage(spr.white, 0, 0);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = color;
  x.fillRect(0, 0, c.width, c.height);
  cache[color] = c;
  return c;
}

// Additive colored glow over the sprite, sharing drawSprite's transform.
function drawSpriteGlow(ctx, spr, cx, cy, drawH, flip, anim, color, alpha) {
  const tint = tintedSprite(spr, color);
  const s = drawH / spr.canvas.height;
  const w = spr.canvas.width * s, h = drawH;
  const a = anim || NO_ANIM;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy + a.bob);
  if (a.rot) ctx.rotate(a.rot);
  ctx.scale((flip ? -1 : 1) * a.sclX, a.sclY);
  ctx.drawImage(tint, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// Corruption's rot orbs ride a tilted orbit around the warlock; `front` picks
// the half that passes in front of him (drawn after the sprite).
function drawRotOrbit(ctx, p, front) {
  const n = 3 + Math.floor((p.lvl || 1) / 2);
  const blob = glowBlob("#7fdc4a");
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const a = p.t * 1.5 + (i / n) * Math.PI * 2;
    const sn = Math.sin(a);
    if ((sn > 0) !== front) continue;
    const depth = 0.72 + sn * 0.28;                 // à frente = maior e mais forte
    const bob = Math.sin(p.t * 3 + i * 1.7) * p.r * 0.12;
    const x = p.x + Math.cos(a) * p.r * 1.45;
    const y = p.y + p.r * 0.15 + sn * p.r * 0.5 + bob;
    const w = p.r * 0.42 * depth;
    ctx.globalAlpha = 0.5 * depth;
    ctx.drawImage(blob, x - w, y - w, w * 2, w * 2);
    ctx.globalAlpha = 0.7 * depth;
    ctx.fillStyle = "#b6ff7c";
    ctx.beginPath(); ctx.arc(x, y, 1.5 * depth, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Demonic Pact chain links on a tilted orbit; `front` picks the half that
// passes in front of the warlock (drawn after the sprite) from the one behind.
function drawPactChain(ctx, p, front) {
  const links = 10;
  ctx.strokeStyle = front ? "rgba(255,170,90,0.95)" : "rgba(255,138,60,0.5)";
  ctx.lineWidth = 1.6;
  for (let i = 0; i < links; i++) {
    const a = p.t * 1.6 + (i / links) * Math.PI * 2;
    const sn = Math.sin(a);
    if ((sn > 0) !== front) continue;
    const sc = 0.75 + sn * 0.25;
    ctx.save();
    ctx.translate(p.x + Math.cos(a) * p.r * 1.7, p.y + p.r * 0.15 + sn * p.r * 0.55);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, 3.6 * sc, 2.2 * sc, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

const NO_COMBOS = [];

// tile de chão tileável (pedra fel). Cantos com runa → grade de pontos roxos.
function makeGroundTile() {
  const T = BALANCE.world.tile;
  const c = document.createElement("canvas");
  c.width = T; c.height = T;
  const x = c.getContext("2d");
  x.fillStyle = "#0d0a16";
  x.fillRect(0, 0, T, T);
  for (let i = 0; i < 70; i++) {
    const px = 4 + Math.random() * (T - 8), py = 4 + Math.random() * (T - 8);
    const sz = 1 + Math.random() * 2;
    x.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,0.025)" : "rgba(0,0,0,0.28)";
    x.fillRect(px, py, sz, sz);
  }
  x.strokeStyle = "rgba(111,220,74,0.05)";
  x.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    let cx = 12 + Math.random() * (T - 24), cy = 12 + Math.random() * (T - 24);
    x.beginPath(); x.moveTo(cx, cy);
    for (let j = 0; j < 4; j++) { cx += -7 + Math.random() * 14; cy += -7 + Math.random() * 14; x.lineTo(cx, cy); }
    x.stroke();
  }
  x.strokeStyle = "rgba(0,0,0,0.35)";
  x.lineWidth = 2;
  x.strokeRect(0.5, 0.5, T - 1, T - 1);
  x.fillStyle = "rgba(122,60,255,0.14)";
  for (const [dx, dy] of [[0, 0], [T, 0], [0, T], [T, T]]) {
    x.beginPath(); x.arc(dx, dy, 3.5, 0, Math.PI * 2); x.fill();
  }
  return c;
}

// --- Pool genérico de objetos (evita GC no loop). Usado a partir da Etapa 2. ---
class Pool {
  constructor(factory, reset) {
    this.factory = factory;
    this.reset = reset;
    this.active = [];
    this.free = [];
  }
  spawn(...args) {
    const obj = this.free.pop() || this.factory();
    this.reset(obj, ...args);
    this.active.push(obj);
    return obj;
  }
  release(i) {
    const obj = this.active[i];
    const last = this.active.length - 1;
    this.active[i] = this.active[last];
    this.active.pop();
    this.free.push(obj);
  }
  clear() {
    while (this.active.length) this.release(this.active.length - 1);
  }
}

// --- Grid espacial: indexa inimigos por célula p/ buscas vizinhas baratas ---
class SpatialGrid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  _key(cx, cy) { return cx + "," + cy; }
  insert(e) {
    const k = this._key(Math.floor(e.x / this.cell), Math.floor(e.y / this.cell));
    let b = this.map.get(k);
    if (!b) { b = []; this.map.set(k, b); }
    b.push(e);
  }
  // chama fn(e) para cada inimigo nas 9 células ao redor de (x,y)
  forNear(x, y, fn) {
    const cx = Math.floor(x / this.cell), cy = Math.floor(y / this.cell);
    for (let ox = -1; ox <= 1; ox++)
      for (let oy = -1; oy <= 1; oy++) {
        const b = this.map.get(this._key(cx + ox, cy + oy));
        if (b) for (let i = 0; i < b.length; i++) fn(b[i]);
      }
  }
  // fn(e) para inimigos nas células que cobrem o círculo (x,y,r) — caller checa distância
  forRadius(x, y, r, fn) {
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cx = x0; cx <= x1; cx++)
      for (let cy = y0; cy <= y1; cy++) {
        const b = this.map.get(this._key(cx, cy));
        if (b) for (let i = 0; i < b.length; i++) fn(b[i]);
      }
  }
}

// --- Som procedural via WebAudio (sem assets). Toggle com M. ---
class Sfx {
  constructor() { this.ctx = null; this.muted = false; this._lastDeath = 0; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  }
  // toca um tom simples com envelope de decaimento
  tone(freq, dur, type = "sine", vol = 0.08, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  }
  death() {
    if (!this.ctx) return;
    if (this.ctx.currentTime - this._lastDeath < 0.05) return; // throttle anti-buzz
    this._lastDeath = this.ctx.currentTime;
    this.tone(180 + Math.random() * 60, 0.09, "square", 0.04);
  }
  hurt() { this.tone(120, 0.18, "sawtooth", 0.1); }
  levelUp() { this.tone(523, 0.12, "triangle", 0.12); this.tone(784, 0.16, "triangle", 0.1, 0.1); }
  combo() {
    this.tone(440, 0.1, "triangle", 0.12);
    this.tone(660, 0.1, "triangle", 0.12, 0.09);
    this.tone(880, 0.18, "triangle", 0.12, 0.18);
  }
  boss() { this.tone(80, 0.5, "sawtooth", 0.14); this.tone(60, 0.6, "sawtooth", 0.12, 0.05); }
  item() { this.tone(700, 0.09, "sine", 0.12); this.tone(1050, 0.12, "sine", 0.1, 0.08); }
  gameOver() { this.tone(330, 0.3, "triangle", 0.12); this.tone(196, 0.5, "triangle", 0.12, 0.18); }
}

// --- Input ---
class InputManager {
  constructor() {
    this.keys = new Set();
    const norm = (e) => {
      const k = e.key.toLowerCase();
      return ({ arrowup: "w", arrowdown: "s", arrowleft: "a", arrowright: "d" })[k] || k;
    };
    addEventListener("keydown", (e) => {
      const k = norm(e);
      if ("wasd".includes(k)) e.preventDefault();
      this.keys.add(k);
    });
    addEventListener("keyup", (e) => this.keys.delete(norm(e)));
    addEventListener("blur", () => this.keys.clear());
  }
  // vetor de direção normalizado a partir do WASD
  moveVector(out) {
    let x = (this.keys.has("d") ? 1 : 0) - (this.keys.has("a") ? 1 : 0);
    let y = (this.keys.has("s") ? 1 : 0) - (this.keys.has("w") ? 1 : 0);
    if (x && y) { const inv = Math.SQRT1_2; x *= inv; y *= inv; }
    out.x = x; out.y = y;
    return out;
  }
}

// --- Camera: segue o player, converte mundo→tela, desenha chão infinito ---
class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.w = 0;
    this.h = 0;
    this.shake = 0;
    this.ox = 0;
    this.oy = 0;
    this.pattern = null; // textura do chão (CanvasPattern), setada pelo Game
  }
  resize(w, h) { this.w = w; this.h = h; }
  follow(target, dt, instant = false) {
    const t = instant ? 1 : 1 - Math.pow(1 - BALANCE.camera.lerp, dt * 60);
    this.x += (target.x - this.x) * t;
    this.y += (target.y - this.y) * t;
  }
  updateShake(dt) {
    if (this.shake > 0) {
      this.ox = (Math.random() * 2 - 1) * this.shake;
      this.oy = (Math.random() * 2 - 1) * this.shake;
      this.shake = Math.max(0, this.shake - dt * 30);
    } else { this.ox = 0; this.oy = 0; }
  }
  // canto superior-esquerdo do viewport em coords de mundo (com shake)
  get left() { return this.x - this.w / 2 + this.ox; }
  get top() { return this.y - this.h / 2 + this.oy; }

  // chão procedural: tile texturizado repetido, deslocado pela posição da câmera
  drawGround(ctx) {
    const t = BALANCE.world.tile;
    const left = this.left, top = this.top;
    const offX = left - Math.floor(left / t) * t;
    const offY = top - Math.floor(top / t) * t;
    ctx.save();
    ctx.translate(-offX, -offY);
    ctx.fillStyle = this.pattern;
    ctx.fillRect(0, 0, this.w + t, this.h + t);
    ctx.restore();
  }
}
